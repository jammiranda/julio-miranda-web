<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Academia en línea · Demo interactiva</title>
<meta name="description" content="Probá una plataforma de cursos completa: catálogo, inscripción, aula con videos, clase en vivo con asistencia, examen, certificado verificable y panel de administración. Demo con datos de ejemplo.">
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,500&display=swap">
<style>
/* ===== Kit de demo: barra superior, marca y recorrido guiado ===== */
:root{--k-accent:#C8231F;--k-accent-2:#9E1A17;--k-accent-soft:#FBEAEA;--k-ink:#0B0D12;--k-gray:#4A515C;--kbar-h:36px}
html[data-marca="blanca"]{--k-accent:#1D4E89;--k-accent-2:#153A66;--k-accent-soft:#E7EEF7}
body{padding-top:var(--kbar-h)}
.kbar{position:fixed;inset:0 0 auto 0;z-index:9000;background:#0B0D12;color:#E9EBEF;font:500 13px/1.3 Inter,system-ui,sans-serif;border-bottom:1px solid #22262E}
.kbar-in{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;padding:6px 16px;min-height:36px;box-sizing:border-box;max-width:1600px;margin:0 auto}
.kbar-msg{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.kbar-dot{width:7px;height:7px;border-radius:50%;background:#F5B83D;flex:none}
.kbar a,.kbar button{font:inherit;color:inherit}
.kbar .kcta{background:var(--k-accent);color:#fff;text-decoration:none;padding:4px 10px;border-radius:6px;font-weight:600;white-space:nowrap}
.kbar .kcta:hover{background:var(--k-accent-2)}
.kbar-tools{margin-left:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.kbar .klink{color:#E9EBEF;text-decoration:underline;text-underline-offset:3px}
.kbar .kbtn{background:transparent;border:1px solid #3A404B;border-radius:6px;padding:3px 9px;cursor:pointer;white-space:nowrap}
.kbar .kbtn:hover{border-color:#8A93A3}
.kseg{display:inline-flex;align-items:center;gap:6px;color:#AEB4BF}
.kseg span{white-space:nowrap}
.kseg-g{display:inline-flex;border:1px solid #3A404B;border-radius:6px;overflow:hidden}
.kseg-g button{background:transparent;border:0;padding:3px 8px;cursor:pointer;color:#C9CED6}
.kseg-g button[aria-pressed="true"]{background:#E9EBEF;color:#0B0D12;font-weight:600}
.kbar :focus-visible,.ktour-card :focus-visible{outline:2px solid #F5B83D;outline-offset:2px}
.kbar-in>*{flex:none}.kbr{display:none}.kbar-msg{order:1}.kcta{order:2}#kTourBtn{order:3;margin-left:auto}.kseg{order:4}.klink{order:5}
.kbtn .km{display:none}
@media (max-width:640px){.kbar{font-size:12px}.kbar-in{padding:5px 12px;gap:5px 8px}.klink{order:2}#kTourBtn{order:3}.kbr{display:block;order:4;flex-basis:100%;height:0}.kcta{order:5}.kseg{order:6;margin-left:auto}
 .kseg>span:first-child{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}.kseg-g button{padding:3px 7px;font-size:11.5px}.kbtn .kd{display:none}.kbtn .km{display:inline}.kbar .kcta{padding:3px 9px}}
main:focus,[tabindex="-1"]:focus{outline:none}
.klogo{display:inline-flex;align-items:center;gap:0;font:800 1em/1 "Inter Tight",Inter,system-ui,sans-serif;letter-spacing:-.01em;white-space:nowrap}
.klogo .r{color:#C8231F}
.klogo .km{margin-right:.45em;width:1.5em;height:1.5em;border-radius:.4em;background:var(--k-accent);display:inline-grid;place-items:center;color:#fff;font-size:.62em;letter-spacing:0}
html[data-marca="blanca"] .k-dvb-only{display:none!important}
html:not([data-marca="blanca"]) .k-white-only{display:none!important}
/* recorrido */
.ktour-shield{position:fixed;inset:0;z-index:9500;background:transparent;cursor:default}
.ktour-ring{position:fixed;z-index:9510;pointer-events:none;border-radius:10px;box-shadow:0 0 0 3px #F5B83D,0 0 0 9999px rgba(11,13,18,.28);transition:all .45s cubic-bezier(.3,.7,.2,1);opacity:0}
.ktour-cursor{position:fixed;z-index:9600;left:50%;top:50%;width:28px;height:28px;pointer-events:none;transition:left .75s cubic-bezier(.4,.1,.2,1),top .75s cubic-bezier(.4,.1,.2,1);filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.ktour-cursor.click::after{content:"";position:absolute;left:-14px;top:-14px;width:28px;height:28px;border-radius:50%;border:3px solid #F5B83D;animation:kclick .5s ease-out}
@keyframes kclick{from{transform:scale(.3);opacity:1}to{transform:scale(1.6);opacity:0}}
.ktour-cap{position:fixed;z-index:9700;left:50%;bottom:22px;transform:translateX(-50%);width:min(920px,calc(100% - 24px));box-sizing:border-box;background:rgba(11,13,18,.94);color:#fff;border-radius:14px;padding:16px 22px 16px 22px;font:600 clamp(17px,2.1vw,24px)/1.35 "Inter Tight",Inter,system-ui,sans-serif;box-shadow:0 12px 40px rgba(0,0,0,.35);display:flex;gap:14px;align-items:flex-start}
.ktour-cap .n{flex:none;font:700 13px/1 Inter,system-ui,sans-serif;background:var(--k-accent);border-radius:999px;padding:6px 9px;margin-top:3px}
.ktour-cap .t{flex:1}
.ktour-cap button{flex:none;background:transparent;border:1px solid #4A515C;color:#C9CED6;border-radius:8px;font:500 12px Inter,sans-serif;padding:5px 8px;cursor:pointer}
.ktour-end{position:fixed;inset:0;z-index:9800;display:grid;place-items:center;background:rgba(11,13,18,.72);padding:16px}
.ktour-card{background:#fff;color:#0B0D12;border-radius:20px;padding:36px 32px;max-width:520px;width:100%;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.4);font-family:Inter,system-ui,sans-serif}
.ktour-card h2{font:800 clamp(26px,4vw,36px)/1.15 "Inter Tight",Inter,sans-serif;margin:0 0 10px;letter-spacing:-.02em}
.ktour-card .big{font:800 clamp(28px,5vw,42px)/1 "Inter Tight",Inter,sans-serif;color:var(--k-accent);margin:14px 0 22px;letter-spacing:-.02em}
.ktour-card p{color:#4A515C;margin:0 0 6px;font-size:16px}
.ktour-card .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.ktour-card a,.ktour-card button{font:600 15px Inter,sans-serif;border-radius:10px;padding:11px 18px;cursor:pointer;text-decoration:none}
.ktour-card a{background:var(--k-accent);color:#fff;border:0}
.ktour-card button{background:#fff;border:1px solid #C3C8D1;color:#0B0D12}
@media print{.kbar,.ktour-cap,.ktour-cursor,.ktour-ring,.ktour-shield,.ktour-end{display:none!important}body{padding-top:0!important}}
html.ktour-on .toast{bottom:auto!important;top:calc(var(--kbar-h) + 72px)!important}

:root{--bg:#F4F5F7;--sf:#fff;--line:#E2E5EA;--ink:#0B0D12;--mut:#4A515C;--mut2:#6B7280;--ok:#13795B;--ok-s:#E3F4EC;--warn:#8A5A00;--warn-s:#FFF4DB;--live:#C8231F;--r:14px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Inter Tight",Inter,sans-serif;letter-spacing:-.015em;margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--k-accent);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* cabecera de la app */
.app-h{position:sticky;top:var(--kbar-h);z-index:50;background:var(--sf);border-bottom:1px solid var(--line)}
.app-h-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:18px;padding:12px 20px}
.brandbox{display:flex;align-items:center;gap:10px;font-size:19px;flex:none}
.brandbox .sep{width:1px;height:20px;background:var(--line)}
.brandbox small{font:600 14px Inter,sans-serif;color:var(--mut)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;padding:8px 12px;border-radius:9px;cursor:pointer;color:var(--mut);font-weight:600;white-space:nowrap;font-size:14px}
.tab:hover{background:var(--bg);color:var(--ink)}
.tab[aria-current="page"]{background:var(--k-accent-soft);color:var(--k-accent)}
.who{display:flex;align-items:center;gap:8px;flex:none;font-size:13px;color:var(--mut)}
.av{width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;font:700 12px Inter,sans-serif;color:#fff;flex:none}
@media (max-width:860px){.app-h-in{flex-wrap:wrap;gap:8px 12px;padding:10px 16px}.tabs{order:3;flex-basis:100%}.who span{display:none}}
main{max-width:1240px;margin:0 auto;padding:24px 20px 120px}
@media (max-width:640px){main{padding:18px 16px 120px}}
.card{background:var(--sf);border:1px solid var(--line);border-radius:var(--r)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer;border:1px solid transparent;text-decoration:none;font-size:14.5px}
.btn-p{background:var(--k-accent);color:#fff}.btn-p:hover{background:var(--k-accent-2)}
.btn-s{background:var(--sf);border-color:#C3C8D1;color:var(--ink)}.btn-s:hover{border-color:var(--ink)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--bg);color:var(--mut)}
.pill.ok{background:var(--ok-s);color:var(--ok)}.pill.warn{background:var(--warn-s);color:var(--warn)}.pill.acc{background:var(--k-accent-soft);color:var(--k-accent)}
.muted{color:var(--mut)}
.eyebrow{font:700 12px Inter,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
/* catálogo */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:24px;align-items:center;padding:28px;margin-bottom:20px;background:linear-gradient(120deg,#0B0D12 0%,#1B2130 100%);color:#fff;border:0;overflow:hidden;position:relative}
.hero h1{font-size:clamp(26px,3.4vw,40px);line-height:1.08;margin:8px 0 10px}
.hero p{color:#C9CED6;margin:0 0 18px;max-width:52ch}
.hero .eyebrow{color:#AEB4BF}
.hero .stats{display:flex;gap:22px;flex-wrap:wrap}
.hero .stats b{display:block;font:800 24px "Inter Tight",sans-serif}
.hero .stats span{font-size:13px;color:#AEB4BF}
.hero svg{width:100%;height:auto;max-height:220px}
@media (max-width:760px){.hero{grid-template-columns:1fr;padding:22px}.hero svg{display:none}}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 0 16px}
.chip{border:1px solid var(--line);background:var(--sf);border-radius:999px;padding:6px 13px;cursor:pointer;font-size:13.5px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.search{margin-left:auto;position:relative}
.search input{border:1px solid #C3C8D1;border-radius:10px;padding:8px 12px 8px 34px;width:240px;background:var(--sf)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%)}
@media (max-width:640px){.search{margin-left:0;width:100%}.search input{width:100%}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.course{display:flex;flex-direction:column;overflow:hidden;transition:box-shadow .2s,transform .2s}
.course:hover{box-shadow:0 10px 30px rgba(11,13,18,.08);transform:translateY(-2px)}
.course .cover{aspect-ratio:16/8;display:block;width:100%}
.course .body{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1}
.course h3{font-size:18px;line-height:1.25}
.course .meta{display:flex;gap:6px;flex-wrap:wrap}
.course .row{display:flex;gap:8px;margin-top:auto;padding-top:8px}
.course .row .btn{flex:1;padding:9px 10px}
.empty{padding:40px;text-align:center;color:var(--mut)}
/* modal */
.modal{position:fixed;inset:0;z-index:200;background:rgba(11,13,18,.55);display:grid;place-items:center;padding:16px}
.modal .card{width:min(560px,100%);max-height:calc(100vh - 80px);overflow:auto;padding:24px}
.modal h2{font-size:24px;margin-bottom:4px}
.field{display:flex;flex-direction:column;gap:5px;margin:12px 0}
.field label{font-weight:600;font-size:14px}
.field input,.field select{border:1px solid #9AA1AD;border-radius:10px;padding:10px 12px;background:#fff}
.check{display:flex;gap:8px;align-items:flex-start;font-size:14px;color:var(--mut);margin:12px 0}
.err{color:#B42318;font-size:13px;min-height:18px}
.syl{margin:12px 0;padding:0;list-style:none;border:1px solid var(--line);border-radius:12px}
.syl li{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:10px;font-size:14px}
.syl li:first-child{border-top:0}
.syl .n{color:var(--mut);font-variant-numeric:tabular-nums;width:22px}
/* aula */
.aula{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
@media (max-width:960px){.aula{grid-template-columns:1fr}}
.player{background:#0B0D12;border-radius:var(--r);overflow:hidden;position:relative;aspect-ratio:16/9;color:#fff;user-select:none}
.player svg.poster{position:absolute;inset:0;width:100%;height:100%}
.player .big{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:76px;height:76px;border-radius:50%;border:0;background:var(--k-accent);color:#fff;cursor:pointer;display:grid;place-items:center;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.player .big:hover{transform:translate(-50%,-50%) scale(1.05)}
.player .sub{position:absolute;left:50%;bottom:58px;transform:translateX(-50%);background:rgba(0,0,0,.72);padding:6px 12px;border-radius:6px;font-size:clamp(13px,1.6vw,16px);max-width:86%;text-align:center}
.player .ctrl{position:absolute;left:0;right:0;bottom:0;padding:10px 14px;background:linear-gradient(transparent,rgba(0,0,0,.75));display:flex;align-items:center;gap:12px;font-size:13px;font-variant-numeric:tabular-nums}
.player .ctrl button{background:none;border:0;color:#fff;cursor:pointer;padding:4px;display:grid;place-items:center}
.player .bar{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.3);overflow:hidden}
.player .bar i{display:block;height:100%;width:0;background:var(--k-accent)}
html[data-marca="blanca"] .player .bar i{background:#7FA8DA}
.lesson-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin:16px 0 6px;flex-wrap:wrap}
.lesson-h h2{font-size:22px}
.prog{height:10px;border-radius:6px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok);transition:width .6s cubic-bezier(.3,.7,.2,1)}
.lessons{list-style:none;margin:0;padding:0}
.lessons li{border-top:1px solid var(--line)}
.lessons button{width:100%;text-align:left;background:none;border:0;padding:12px 16px;display:flex;gap:12px;align-items:center;cursor:pointer;font-size:14px}
.lessons button:hover{background:var(--bg)}
.lessons button[aria-current="true"]{background:var(--k-accent-soft)}
.lessons .st{width:24px;height:24px;border-radius:50%;border:2px solid #9AA1AD;display:grid;place-items:center;flex:none}
.lessons .st.done{background:var(--ok);border-color:var(--ok);color:#fff}
.lessons .st.lock{border-style:dashed}
.lessons small{display:block;color:var(--mut);font-size:12.5px}
.side-h{padding:16px}
.notes{padding:16px;margin-top:16px}
/* en vivo */
.live-wrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px}
@media (max-width:960px){.live-wrap{grid-template-columns:1fr}}
.stage{background:#0B0D12;border-radius:var(--r);aspect-ratio:16/9;position:relative;overflow:hidden}
.stage svg{width:100%;height:100%;display:block}
.badge-live{position:absolute;left:14px;top:14px;background:var(--live);color:#fff;font:700 12px Inter,sans-serif;padding:4px 9px;border-radius:6px;display:flex;gap:6px;align-items:center}
.badge-live i{width:8px;height:8px;border-radius:50%;background:#fff;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
.tiles{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:10px}
@media (max-width:640px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{background:#1B2130;border-radius:10px;aspect-ratio:4/3;display:grid;place-items:center;position:relative;color:#fff}
.tile span{position:absolute;left:6px;bottom:4px;font-size:11px;color:#E9EBEF}
.chat{display:flex;flex-direction:column;height:100%;min-height:380px}
.chat .msgs{flex:1;overflow:auto;padding:12px 16px;display:flex;flex-direction:column;gap:10px;max-height:420px}
.chat .m{font-size:14px}.chat .m b{font-weight:600}
.chat .m small{color:var(--mut)}
.att{padding:16px;border-bottom:1px solid var(--line)}
/* examen */
.q{padding:20px;margin-bottom:14px}
.q fieldset{border:0;margin:0;padding:0}
.q legend{font:700 18px "Inter Tight",sans-serif;margin-bottom:10px;padding:0}
.opt{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border:1px solid var(--line);border-radius:10px;margin:8px 0;cursor:pointer}
.opt:hover{border-color:#9AA1AD}
.opt input{margin-top:3px;accent-color:var(--k-accent)}
.opt.right{border-color:var(--ok);background:var(--ok-s)}.opt.wrong{border-color:#B42318;background:#FDECEA}
.result{padding:20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
/* certificado */
.cert-wrap{overflow:auto}
.cert{width:100%;max-width:920px;margin:0 auto;display:block;background:#fff;border-radius:6px;box-shadow:0 20px 50px rgba(11,13,18,.12)}
.cert-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:18px 0}
/* verificar */
.verify{max-width:640px;margin:0 auto}
.verify form{display:flex;gap:10px;flex-wrap:wrap}
.verify input{flex:1;min-width:200px;border:1px solid #9AA1AD;border-radius:10px;padding:12px 14px;font:600 17px/1 "Inter",monospace;letter-spacing:.06em;text-transform:uppercase}
.vres{margin-top:16px;padding:20px;display:flex;gap:14px;align-items:flex-start}
.vres .ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none}
.vres dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:10px 0 0;font-size:14px}
.vres dt{color:var(--mut)}
/* admin */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{padding:16px}
.kpi .v{font:800 30px/1.1 "Inter Tight",sans-serif;margin:6px 0 2px}
.kpi small{color:var(--mut)}
.kpi .d{color:var(--ok);font-weight:600;font-size:13px}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-bottom:16px}
@media (max-width:960px){.two{grid-template-columns:1fr}}
.panel{padding:18px}
.panel h3{font-size:17px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);font-weight:600;padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.new td{background:#FFFBEA}
.mini{height:8px;border-radius:5px;background:var(--line);overflow:hidden;width:110px;display:inline-block;vertical-align:middle;margin-right:8px}
.mini i{display:block;height:100%;background:var(--ok)}
.hb{display:grid;grid-template-columns:150px 1fr 40px;gap:10px;align-items:center;font-size:13.5px;margin:9px 0}
.hb .t{height:12px;background:var(--bg);border-radius:6px;overflow:hidden}.hb .t i{display:block;height:100%;background:var(--k-accent);border-radius:6px}
@media (max-width:640px){.hb{grid-template-columns:110px 1fr 34px}}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar select,.toolbar input{border:1px solid #9AA1AD;border-radius:9px;padding:7px 10px;background:#fff;font-size:14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0B0D12;color:#fff;padding:12px 18px;border-radius:10px;z-index:300;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
.foot{max-width:1240px;margin:0 auto;padding:0 20px 40px;color:var(--mut);font-size:13px;display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between}

/* ===== Kit de demo: barra superior, marca y recorrido guiado ===== */
const KIT=(()=>{
  const Q=new URLSearchParams(location.search);
  const white=Q.get("marca")==="blanca";
  const showSel=!white||Q.get("selector")==="1";
  const product=(window.DEMO&&DEMO.product)||"Demo";
  const SITE="https://www.devisebit.com/";
  const contact=SITE+"contacto?tema="+encodeURIComponent("Demo: "+product)+"#formulario";
  const brandName=white?"Tu Marca":"DEVISEBIT";
  document.documentElement.dataset.marca=white?"blanca":"devisebit";
  const accent=white?"#1D4E89":"#C8231F";
  const logo=(sub)=>white
    ?`<span class="klogo"><span class="km" aria-hidden="true">TM</span><span>Tu Marca</span></span>`
    :`<span class="klogo" aria-label="DEVISEBIT"><span>DEVISE</span><span class="r">BIT</span></span>`;
  const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  function url(over){const q=new URLSearchParams(location.search);for(const k in over){if(over[k]==null)q.delete(k);else q.set(k,over[k])}const s=q.toString();return location.pathname+(s?"?"+s:"")+location.hash}
  function bar(){
    const b=document.createElement("div");b.className="kbar";b.setAttribute("role","region");b.setAttribute("aria-label","Aviso de demo");
    const sel=showSel?`<span class="kseg"><span id="kselLbl">Marca:</span><span class="kseg-g" role="group" aria-labelledby="kselLbl"><button type="button" data-kbrand="devisebit" aria-pressed="${!white}">DEVISEBIT</button><button type="button" data-kbrand="blanca" aria-pressed="${white}">Tu marca</button></span></span>`:"";
    b.innerHTML=`<div class="kbar-in"><div class="kbar-msg"><span class="kbar-dot" aria-hidden="true"></span><span>Demo con datos de ejemplo${white?"":" ·"}</span></div>${white?"":`<a class="kcta" href="${contact}">Quiero esto para mi organización</a>`}<button type="button" class="kbtn" id="kTourBtn">▶ <span class="kd">Ver recorrido guiado</span><span class="km">Recorrido</span></button><span class="kbr" aria-hidden="true"></span>${sel}${white?"":`<a class="klink" href="${SITE}">Inicio</a>`}</div>`;
    document.body.prepend(b);
    b.querySelectorAll("[data-kbrand]").forEach(x=>x.onclick=()=>{const v=x.dataset.kbrand;location.href=url({marca:v==="blanca"?"blanca":null,selector:v==="blanca"?"1":Q.get("selector")})});
    b.querySelector("#kTourBtn").onclick=()=>{location.href=url({tour:"1"})};
    const fit=()=>document.documentElement.style.setProperty("--kbar-h",b.offsetHeight+"px");
    fit();addEventListener("resize",fit);if(window.ResizeObserver)new ResizeObserver(fit).observe(b);
    if(Q.get("tour")==="1")b.querySelector("#kTourBtn").hidden=true;
  }
  function applyBrand(root=document){
    root.querySelectorAll("[data-k-logo]").forEach(e=>e.innerHTML=logo());
    root.querySelectorAll("[data-k-name]").forEach(e=>e.textContent=brandName);
  }
  /* ---------- recorrido guiado ---------- */
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  let cur,ring,cap,shield,stopped=false,total=0,idx=0,ringEl=null,raf=0;
  const cursorSVG=`<svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path d="M3 2l7.5 19 2.6-7.9L21 10.5z" fill="#fff" stroke="#0B0D12" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
  function el(sel){return typeof sel==="string"?document.querySelector(sel):sel}
  function track(){if(ring&&ringEl&&!ringEl.isConnected)ring.style.opacity=0;else if(ringEl&&ring){const r=ringEl.getBoundingClientRect();Object.assign(ring.style,{left:r.left-6+"px",top:r.top-6+"px",width:r.width+12+"px",height:r.height+12+"px",opacity:r.width?1:0})}raf=requestAnimationFrame(track)}
  async function show(sel,opt={}){
    const e=el(sel);if(!e)return null;
    const r0=e.getBoundingClientRect(),capH=cap?cap.offsetHeight+40:120;
    if(r0.top<parseInt(getComputedStyle(document.documentElement).getPropertyValue("--kbar-h"))+10||r0.bottom>innerHeight-capH){e.scrollIntoView({block:opt.block||"center",behavior:"smooth"});await sleep(650)}
    {const r1=e.getBoundingClientRect();if(r1.left<0||r1.right>innerWidth){e.scrollIntoView({block:"nearest",inline:"center",behavior:"smooth"});await sleep(500)}}
    ringEl=opt.ring===false?null:e;if(!ringEl&&ring)ring.style.opacity=0;
    const r=e.getBoundingClientRect();cur.style.transitionDuration=(opt.wait?opt.wait*.85/1000:.75)+"s";
    cur.style.left=Math.min(innerWidth-30,r.left+Math.min(r.width/2,r.width-8))+"px";cur.style.top=r.top+Math.min(r.height/2,22)+"px";
    await sleep(opt.wait||800);return e;
  }
  async function click(sel,opt){const e=await show(sel,opt);if(!e)return;cur.classList.remove("click");void cur.offsetWidth;cur.classList.add("click");await sleep(180);e.focus&&e.focus({preventScroll:true});e.click();await sleep(350);return e}
  async function type(sel,text,opt={}){
    const e=await show(sel,opt);if(!e)return;e.focus({preventScroll:true});
    const proto=e.tagName==="TEXTAREA"?HTMLTextAreaElement.prototype:HTMLInputElement.prototype;const set=Object.getOwnPropertyDescriptor(proto,"value").set;
    set.call(e,"");e.dispatchEvent(new Event("input",{bubbles:true}));
    for(const ch of text){set.call(e,e.value+ch);e.dispatchEvent(new Event("input",{bubbles:true}));await sleep(opt.speed||55)}
    e.dispatchEvent(new Event("change",{bubbles:true}));await sleep(250);return e;
  }
  async function pick(sel,value){const e=await show(sel);if(!e)return;e.value=value;e.dispatchEvent(new Event("input",{bubbles:true}));e.dispatchEvent(new Event("change",{bubbles:true}));await sleep(300);return e}
  function say(t){idx++;cap.querySelector(".n").textContent=idx+" / "+total;cap.querySelector(".t").textContent=t}
  function end(){
    cancelAnimationFrame(raf);document.documentElement.classList.remove("ktour-on");[cur,ring,cap,shield].forEach(x=>x&&x.remove());
    const o=document.createElement("div");o.className="ktour-end";o.setAttribute("role","dialog");o.setAttribute("aria-modal","true");o.setAttribute("aria-labelledby","kEndT");
    o.innerHTML=white
      ?`<div class="ktour-card"><h2 id="kEndT">Pedí tu demo</h2><p>Lo armamos con tus datos y tu marca.</p><div class="big">${esc(product)}</div><div class="row"><button type="button" id="kEndBack">Seguir explorando</button></div></div>`
      :`<div class="ktour-card"><h2 id="kEndT">¿Lo querés para tu organización?</h2><p>Lo adaptamos a tu marca, tus datos y tu equipo.</p><div class="big">devisebit.com</div><div class="row"><a href="${contact}">Quiero esto para mi organización</a><button type="button" id="kEndBack">Seguir explorando</button></div></div>`;
    document.body.appendChild(o);o.querySelector("#kEndBack").onclick=()=>{o.remove();history.replaceState(null,"",url({tour:null}));const t=document.getElementById("kTourBtn");if(t)t.hidden=false};
    o.querySelector("#kEndBack").focus({preventScroll:true});
    window.__tourDone=true;
  }
  async function run(steps){
    window.__tourDone=false;total=steps.length;idx=0;
    shield=document.createElement("div");shield.className="ktour-shield";shield.title="Recorrido en curso";
    ring=document.createElement("div");ring.className="ktour-ring";
    cur=document.createElement("div");cur.className="ktour-cursor";cur.innerHTML=cursorSVG;
    cap=document.createElement("div");cap.className="ktour-cap";cap.setAttribute("role","status");cap.setAttribute("aria-live","polite");
    cap.innerHTML=`<span class="n"></span><span class="t"></span><button type="button">Salir</button>`;
    document.body.append(shield,ring,cur,cap);document.documentElement.classList.add("ktour-on");track();
    cap.querySelector("button").onclick=()=>{stopped=true};
    addEventListener("keydown",e=>{if(e.key==="Escape")stopped=true});
    const T={show,click,type,pick,sleep,el};
    for(const s of steps){
      if(stopped)break;
      say(s.say);const t0=Date.now();
      try{await s.do(T)}catch(e){console.warn("tour",e)}
      const left=(s.hold||3000)-(Date.now()-t0);if(left>0)await sleep(left);
    }
    end();
  }
  function init(steps){
    bar();applyBrand();
    if(Q.get("tour")==="1")setTimeout(()=>run(typeof steps==="function"?steps():steps),700);
  }
  return {white,brandName,contact,SITE,logo,applyBrand,init,run,esc,accent};
})();

  <p class="muted" style="font-size:13px;margin:12px 0 0">Canales: web 58% · WhatsApp 27% · convenios con empresas 15%</p></section></div>
  <section class="card panel" aria-labelledby="aT"><h3 id="aT">Alumnos <span class="toolbar"><label class="sr" for="fC">Filtrar por curso</label><select id="fC"><option>Todos</option>${COURSES.map(c=>`<option ${S.adminCourse===c.t?"selected":""}>${esc(c.t)}</option>`).join("")}</select><label class="sr" for="fQ">Buscar alumno</label><input id="fQ" type="search" placeholder="Buscar alumno" value="${esc(S.adminQ)}"></span></h3>
  <div class="tbl-wrap"><table><thead><tr><th scope="col">Alumno/a</th><th scope="col">Curso</th><th scope="col">Avance</th><th scope="col">Asistencia</th><th scope="col">Último ingreso</th><th scope="col">Estado</th></tr></thead><tbody>
  ${f.map(r=>`<tr class="${r.isNew?"new":""}"><td style="white-space:nowrap"><span class="av" style="background:${avc(r.n)};width:28px;height:28px;font-size:11px;margin-right:8px">${ini(r.n)}</span>${esc(r.n)}${r.isNew?` <span class="pill acc">Nuevo</span>`:""}</td><td style="min-width:200px">${esc(r.c)}</td><td style="white-space:nowrap"><span class="mini"><i style="width:${r.p}%"></i></span>${r.p}%</td><td>${r.a}%</td><td style="white-space:nowrap">${r.last}</td><td><span class="pill ${r.st==="Certificado"?"ok":r.st==="Por rendir"?"warn":""}">${r.st}</span></td></tr>`).join("")||`<tr><td colspan="6" class="muted">Sin resultados.</td></tr>`}</tbody></table></div></section>`;
};
/* ---------- render y eventos ---------- */
let chatT=null,play=null;
function go(v,focus){S.view=v;render();window.scrollTo({top:0});if(focus)$("#view").focus({preventScroll:true})}
function render(){
  stopPlay();clearInterval(chatT);
  const map={cert:"examen"};
  $$(".tab").forEach(t=>t.setAttribute("aria-current",t.dataset.v===(map[S.view]||S.view)?"page":"false"));
  $("#view").innerHTML=V[S.view]();
  $("#who").innerHTML=S.user?`<span>${esc(S.user.n)}</span><span class="av" style="background:${avc(S.user.n)}">${ini(S.user.n)}</span>`:`<span>Visitante</span><span class="av" style="background:#9AA1AD">?</span>`;
  bind();
}
function bind(){
  $$("[data-cat]").forEach(b=>b.onclick=()=>{S.cat=b.dataset.cat;render()});
  const q=$("#q");if(q)q.oninput=()=>{S.q=q.value;const p=q.selectionStart;render();const n=$("#q");n.focus();n.setSelectionRange(p,p)};
  $$("[data-go]").forEach(b=>b.addEventListener("click",()=>{if(b.dataset.code){S.vcode=b.dataset.code;S.vres=null}go(b.dataset.go,true)}));
  $$("[data-enroll]").forEach(b=>b.onclick=()=>enroll(b.dataset.enroll));
  $$("[data-detail]").forEach(b=>b.onclick=()=>detail(b.dataset.detail));
  $$("[data-les]").forEach(b=>b.onclick=()=>{S.cur=+b.dataset.les;render()});
  const ms=$("#markSeen");if(ms)ms.onclick=markSeen;
  const bp=$("#bigPlay"),pp=$("#pp");if(bp){bp.onclick=togglePlay;pp.onclick=togglePlay}
  const pr=$("#presente");if(pr)pr.onclick=()=>{if(!S.user){toast("Primero inscribite en un curso del catálogo.");return}const d=new Date();S.att=true;S.attAt=`${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;render();toast("Tu presente quedó registrado.")};
  if(S.view==="vivo"){let k=3;chatT=setInterval(()=>{const m=$("#msgs");if(!m||k>=CHAT.length){clearInterval(chatT);return}m.insertAdjacentHTML("beforeend",`<div class="m"><b>${esc(CHAT[k][0])}</b> <small>19:0${k}</small><br>${esc(CHAT[k][1])}</div>`);m.scrollTop=m.scrollHeight;k++},2200)}
  const ex=$("#exam");if(ex)ex.onsubmit=e=>{e.preventDefault();const c=course(S.cid);const a={};c.exam.forEach((q,i)=>{const r=ex.querySelector(`input[name=q${i}]:checked`);if(r)a[i]=+r.value});
    if(Object.keys(a).length<3){$("#exErr").textContent="Respondé las 3 preguntas para enviar.";return}
    S.ans=a;S.examDone=true;S.score=c.exam.filter((q,i)=>a[i]===q[2]).length;
    if(S.score>=2&&!S.cert){const d=new Date(),A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",r=n=>Array.from({length:n},()=>A[Math.floor(Math.random()*A.length)]).join("");
      S.cert={n:S.user.n,c:c.t,f:d.toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit",year:"numeric"}),h:c.hrs,p:c.prof,code:`ARR-${r(4)}-${r(4)}`};CERTS[S.cert.code]=S.cert}
    render();window.scrollTo({top:0,behavior:"smooth"})};
  const rt=$("#retry");if(rt)rt.onclick=()=>{S.examDone=false;S.ans={};render()};
  const vf=$("#vform");if(vf)vf.onsubmit=e=>{e.preventDefault();verify($("#vcode").value)};
  $$("[data-try]").forEach(b=>b.onclick=()=>{$("#vcode").value=b.dataset.try;verify(b.dataset.try)});
  const dl=$("#dlCert");if(dl)dl.onclick=downloadCert;
  const fC=$("#fC");if(fC)fC.onchange=()=>{S.adminCourse=fC.value;render()};
  const fQ=$("#fQ");if(fQ)fQ.oninput=()=>{S.adminQ=fQ.value;const p=fQ.selectionStart;render();const n=$("#fQ");n.focus();n.setSelectionRange(p,p)};
}
function verify(v){const code=String(v||"").trim().toUpperCase();S.vcode=code;const c=CERTS[code];S.vres=c?{ok:true,...c,code}:{ok:false};render()}
function markSeen(){const c=course(S.cid);S.seen.add(S.cur);const nx=c.les.findIndex((x,i)=>!S.seen.has(i));if(nx>=0)S.cur=nx;render();toast(S.seen.size===c.les.length?"¡Terminaste las lecciones! Ya podés rendir el examen.":"Lección marcada como vista.")}
function stopPlay(){if(play){clearInterval(play.t);play=null}}
function togglePlay(){
  const bp=$("#bigPlay"),pp=$("#pp"),sub=$("#subt");
  if(play){stopPlay();bp.hidden=false;pp.innerHTML=ICON.play18;pp.setAttribute("aria-label","Reproducir");return}
  const c=course(S.cid),l=c.les[S.cur],[mm,ss]=l[1].split(":").map(Number),dur=mm*60+ss;
  const lines=[`Hola, soy ${c.prof}. En esta clase vemos: ${l[0].toLowerCase()}.`,"Primero, un ejemplo concreto de todos los días.","Después lo practicamos paso a paso.","Al final tenés un ejercicio corto para hacer."];
  bp.hidden=true;pp.innerHTML=ICON.pause;pp.setAttribute("aria-label","Pausar");sub.hidden=false;
  let p=+($("#pbar").dataset.p||0);
  play={t:setInterval(()=>{p=Math.min(100,p+1.25);const b=$("#pbar");if(!b){stopPlay();return}b.style.width=p+"%";b.dataset.p=p;b.parentElement.setAttribute("aria-valuenow",Math.round(p));const s=Math.round(dur*p/100);$("#tcur").textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;sub.textContent=lines[Math.min(3,Math.floor(p/25))];
    if(p>=100){stopPlay();sub.textContent="Fin de la lección. Marcala como vista para avanzar.";pp.innerHTML=ICON.play18;}},100)};
}
function modal(html,onOpen){const r=$("#modalRoot");const prev=document.activeElement;r.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mT">${html}</div>`;const m=r.firstChild;
  const close=()=>{r.innerHTML="";prev&&prev.focus&&prev.focus()};m.addEventListener("click",e=>{if(e.target===m)close()});m.addEventListener("keydown",e=>{if(e.key==="Escape")close()});m.querySelectorAll("[data-close]").forEach(b=>b.onclick=close);
  const f=m.querySelector("input,button");f&&f.focus();onOpen&&onOpen(m,close);return close}
function detail(id){const c=course(id);modal(`<div class="card"><div class="eyebrow">${esc(c.cat)} · ${c.hrs} horas · ${esc(c.lvl)}</div><h2 id="mT">${esc(c.t)}</h2><p class="muted">${esc(c.desc)}</p><ol class="syl">${c.les.map((l,i)=>`<li><span class="n">${i+1}</span><span>${esc(l[0])} <span class="muted">· ${l[1]}</span></span></li>`).join("")}<li><span class="n">★</span><span>Clase en vivo, examen final y certificado verificable</span></li></ol>
  <div style="display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap"><button class="btn btn-s" data-close>Cerrar</button>${S.cid===id?"":`<button class="btn btn-p" id="mEnroll">Inscribirme</button>`}</div></div>`,(m,close)=>{const b=m.querySelector("#mEnroll");if(b)b.onclick=()=>{close();enroll(id)}})}
function enroll(id){
  const c=course(id);
  if(S.cid&&S.cid!==id){toast("En la demo podés cursar un curso por vez. Recargá la página para empezar otro.");return}
  modal(`<form class="card" id="enf" novalidate><div class="eyebrow">Inscripción</div><h2 id="mT">${esc(c.t)}</h2><p class="muted" style="margin:0">Completá tus datos y empezás hoy mismo.</p>
  <div class="field"><label for="enN">Nombre y apellido</label><input id="enN" autocomplete="name" value="${S.user?esc(S.user.n):""}"></div>
  <div class="field"><label for="enE">Email</label><input id="enE" type="email" autocomplete="email" value="${S.user?esc(S.user.e):""}"></div>
  <div class="field"><label for="enS">¿Cómo nos conociste?</label><select id="enS"><option>Redes sociales</option><option>Me lo recomendaron</option><option>Mi empresa tiene convenio</option><option>Buscador</option></select></div>
  <label class="check"><input type="checkbox" id="enP" checked> Acepto la política de privacidad y recibir avisos del curso.</label>
  <div class="err" id="enErr" role="alert"></div>
  <div style="display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap"><button type="button" class="btn btn-s" data-close>Cancelar</button><button class="btn btn-p" type="submit" id="enGo">Confirmar inscripción</button></div>
  <p class="muted" style="font-size:12.5px;margin:12px 0 0">Demo: no se guarda ni se envía ningún dato.</p></form>`,(m,close)=>{
    m.querySelector("#enf").onsubmit=e=>{e.preventDefault();const n=$("#enN").value.trim(),em=$("#enE").value.trim();
      if(n.split(" ").filter(Boolean).length<2){$("#enErr").textContent="Escribí tu nombre y apellido.";$("#enN").focus();return}
      if(!/^\S+@\S+\.\S+$/.test(em)){$("#enErr").textContent="Revisá el email.";$("#enE").focus();return}
      if(!$("#enP").checked){$("#enErr").textContent="Para inscribirte tenés que aceptar la política de privacidad.";return}
      S.user={n,e:em};S.cid=id;S.cur=0;close();go("aula",true);toast("¡Inscripción confirmada! Te mandamos la bienvenida por mail (simulado).")}})
}
function downloadCert(){
  const svg=certSVG(S.cert,true).replace('class="cert" ','').replace(/var\(--k-accent\)/g,KIT.accent);
  const img=new Image();img.onload=()=>{const cv=document.createElement("canvas");cv.width=2000;cv.height=1360;const x=cv.getContext("2d");x.drawImage(img,0,0,2000,1360);
    cv.toBlob(b=>{const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=`certificado-${S.cert.code}.png`;document.body.appendChild(a);a.click();a.remove();toast("Certificado descargado.")})};
  img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);
}
$$(".tab").forEach(t=>t.onclick=()=>go(t.dataset.v));
render();
/* ---------- recorrido guiado ---------- */
KIT.init(()=>[
 {say:"Este es el catálogo de cursos de una institución de ejemplo: filtros, búsqueda y programas.",hold:3600,do:async T=>{await T.click('[data-cat="Tecnología"]');await T.sleep(600);await T.show("#c-ia")}},
 {say:"La inscripción es un formulario simple. Lo completamos como si fuéramos una alumna.",hold:5200,do:async T=>{await T.click('[data-enroll="ia"]');await T.type("#enN","Sofía Benítez",{speed:45});await T.type("#enE","sofia.benitez@correo.demo",{speed:30});await T.click("#enGo")}},
 {say:"Ya está en su aula: cada lección tiene su video, con subtítulos y material.",hold:4200,do:async T=>{await T.click("#bigPlay");await T.sleep(1800);await T.show(".lessons")}},
 {say:"Marca las lecciones como vistas y la barra de avance se actualiza sola.",hold:5200,do:async T=>{for(let i=0;i<4;i++){await T.click("#markSeen",{ring:false});await T.sleep(150)}await T.show(".side-h")}},
 {say:"En la clase en vivo, con un clic da el presente y la asistencia queda registrada.",hold:4200,do:async T=>{await T.click('.tab[data-v="vivo"]');await T.sleep(500);await T.click("#presente")}},
 {say:"Al terminar, rinde un examen corto de 3 preguntas.",hold:5200,do:async T=>{await T.click('.tab[data-v="examen"]');for(let i=0;i<3;i++){const q=course(S.cid).exam[i];await T.click(`#exam input[name=q${i}][value="${q[2]}"]`,{ring:false})}await T.click("#sendExam")}},
 {say:"Aprobó: el certificado se genera al instante, listo para descargar o imprimir.",hold:4000,do:async T=>{await T.click('[data-go="cert"]');await T.show("#certBox")}},
 {say:"Cualquier empresa puede verificarlo pegando el código en la página pública.",hold:4200,do:async T=>{await T.click('.tab[data-v="verificar"]');await T.type("#vcode",S.cert.code,{speed:60});await T.click('#vform button[type="submit"]');await T.show("#vres")}},
 {say:"Y la administración ve alumnos, avance, asistencia y ventas en un solo lugar.",hold:4600,do:async T=>{await T.click('.tab[data-v="admin"]');await T.show(".kpis");await T.sleep(700);await T.show("table",{block:"start"})}}
]);
</script>
</body>
</html>
