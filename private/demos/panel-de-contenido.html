<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel de Contenido · Demo interactiva</title>
<meta name="description" content="Probá un panel de contenido para redes, web y ventas: métricas de Instagram y LinkedIn, ideas y calendario de publicaciones, competencia, CRM, academia y noticias del rubro. Demo con datos de ejemplo.">
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@700;800&display=swap">
<style>
/* Layout: consola operativa — sidebar fija a la izquierda (barra de pestañas arriba en celular), vistas por hash, todo oscuro negro+rojo de marca */
:root{
  --bg:#0b0b0d; --panel:#131317; --panel2:#1a1a20; --line:#26262e; --fg:#ececf0; --muted:#8a8a96;
  --red:#e11d2e; --red-soft:rgba(225,29,46,.14);
  --ok:#22c38e; --warn:#f2b233; --info:#4c8dff; --violet:#9b7bff;
  --ig:#e1306c; --yt:#ff3b3b; --li:#2f8cff; --tt:#25f4ee; --x:#d7d7de;
  --display:"Chakra Petch",ui-sans-serif,system-ui,sans-serif;
  --body:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--panel)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand .mark{width:30px;height:30px;border-radius:7px;background:var(--red);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:15px}
.brand b{font-family:var(--display);letter-spacing:.06em;font-size:15px;display:block}
.brand small{color:var(--muted);font-size:11px}
.acct{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.acct .n{font-family:var(--mono);font-size:18px}
.acct .l{color:var(--muted);font-size:11px}
nav{display:flex;flex-direction:column;gap:2px;overflow:auto}
nav .grp{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:12px 10px 4px}
nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--fg);text-decoration:none;font-size:13.5px}
nav a:hover{background:var(--panel2)}
nav a.on{background:var(--red-soft);color:#fff;box-shadow:inset 2px 0 0 var(--red)}
nav svg{width:16px;height:16px;flex:none;opacity:.85}
.foot{margin-top:auto;color:var(--muted);font-size:11px;padding:0 6px}
main{min-width:0;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:600;font-size:26px;margin:0;letter-spacing:.01em;text-wrap:balance}
h2{font-family:var(--display);font-weight:600;font-size:15px;margin:0;letter-spacing:.02em}
.sub{color:var(--muted);font-size:13px;margin:2px 0 0}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:7px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:#3a3a44}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
.btn.pri:hover{filter:brightness(1.1)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grid{display:grid;gap:14px}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.card .ch{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.k{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.big{font-family:var(--mono);font-size:26px;font-weight:500;font-variant-numeric:tabular-nums}
.delta{font-family:var(--mono);font-size:12px;color:var(--ok)}
.delta.neg{color:var(--red)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);background:var(--panel2);white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}
.ex{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--warn);border:1px solid rgba(242,178,51,.35);border-radius:4px;padding:1px 6px}
.note{background:var(--panel2);border:1px dashed var(--line);border-radius:10px;padding:10px 14px;color:var(--muted);font-size:12.5px}
.note b{color:var(--fg)}
.flow{display:flex;flex-direction:column;gap:9px}
.flow .fr{display:grid;grid-template-columns:96px 1fr 36px;align-items:center;gap:10px;font-size:12.5px}
.bar{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--red);border-radius:99px}
.list{display:flex;flex-direction:column;gap:8px}
.item{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.item .t{font-weight:500;font-size:13.5px}
.item .m{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--muted);font-size:11.5px;font-family:var(--mono)}
.st-idea{color:var(--muted)} .st-borr{color:var(--warn)} .st-prog{color:var(--info)} .st-pub{color:var(--ok)}
.kan{display:grid;grid-template-columns:repeat(2,minmax(0,1fr)) 300px;gap:14px;align-items:start}
.kcols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;grid-column:span 2}
label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted)}
input,select,textarea{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{min-height:70px;resize:vertical}
form{display:flex;flex-direction:column;gap:11px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:transparent;border:0;padding:6px 11px;font-size:12px;color:var(--muted);font-family:var(--mono)}
.seg button.on{background:var(--red);color:#fff}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--mono);font-size:10px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:720px}
th{text-align:left;font-weight:500;color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th button{background:none;border:0;color:inherit;font:inherit;letter-spacing:inherit;text-transform:inherit;padding:0}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle;font-variant-numeric:tabular-nums}
tr:hover td{background:rgba(255,255,255,.02)}
.av{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:12px;background:var(--panel2);border:1px solid var(--line)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cal .dh{background:var(--panel2);padding:8px;font-size:11px;color:var(--muted);text-align:center;letter-spacing:.06em;text-transform:uppercase}
.cal .d{min-height:108px;border-top:1px solid var(--line);border-left:1px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:4px;background:var(--panel);min-width:0}
.cal .d:nth-child(7n+1){border-left:0}
.cal .d.out{background:var(--bg);opacity:.45}
.cal .dn{font-family:var(--mono);font-size:11px;color:var(--muted)}
.cal .d.today .dn{background:var(--red);color:#fff;border-radius:99px;width:20px;height:20px;display:grid;place-items:center}
.ev{font-size:10.5px;padding:3px 5px;border-radius:5px;background:var(--panel2);border-left:3px solid;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel2);border-radius:99px;padding:4px 11px;font-size:12px;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="false"]{opacity:.45}
.chip.on{background:var(--red);border-color:var(--red);color:#fff}
.news{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.nw{display:flex;flex-direction:column;gap:8px}
.nw h3{font-size:15px;margin:0;font-weight:600;line-height:1.35;text-wrap:balance}
.nw p{margin:0;color:var(--muted);font-size:13px}
.nw .m{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-family:var(--mono);font-size:11px;color:var(--muted)}
.spark{width:90px;height:28px}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:24px 8px}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--ok);border-radius:8px;padding:10px 14px;font-size:13px;z-index:40}
@media (max-width:1000px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.kan{grid-template-columns:1fr}.kcols{grid-column:auto}}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  aside{position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:20;padding:10px max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));gap:8px;border-right:0;border-bottom:1px solid var(--line)}
  .acct,.foot,nav .grp{display:none}
  nav{flex-direction:row;overflow-x:auto;gap:4px;scrollbar-width:none}
  nav a{white-space:nowrap;padding:7px 10px;font-size:13px}
  nav a.on{box-shadow:inset 0 -2px 0 var(--red)}
  .g3,.g2,.news,.kcols{grid-template-columns:1fr}
  .cal{grid-template-columns:repeat(7,minmax(0,1fr))}
  .cal .d{min-height:64px;padding:3px}
  .ev{font-size:0;height:6px;padding:0;border-left-width:0}
  h1{font-size:22px}
}
@media (max-width:420px){.g4{grid-template-columns:1fr 1fr}.big{font-size:21px}}

/* ---------- tablero infográfico ---------- */
main{background:radial-gradient(900px 320px at 85% -80px,var(--red-soft),transparent 70%) no-repeat,var(--bg)}
.sec{display:flex;align-items:center;gap:10px;margin:2px 0 -6px}
.sec .k{white-space:nowrap}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.kt{display:flex;flex-direction:column;gap:3px;padding:14px 14px 10px;background:linear-gradient(180deg,var(--panel2),var(--panel) 70%)}
.kt .top{display:flex;justify-content:space-between;align-items:center;gap:6px;min-width:0}
.kt .top .k{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kt .big{font-size:25px;line-height:1.2}
.kt .ft{color:var(--muted);font-size:11.5px;min-height:17px}
.sp{width:100%;height:34px;display:block;margin-top:6px}
.src{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;color:var(--muted)}
.dc{font-family:var(--mono);font-size:11px;padding:1px 7px;border-radius:99px;white-space:nowrap;background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.dc.up{color:var(--ok);background:rgba(34,195,142,.1);border-color:rgba(34,195,142,.28)}
.dc.dn{color:#ff6b78;background:var(--red-soft);border-color:rgba(225,29,46,.32)}
.g3w{display:grid;gap:14px;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.15fr)}
.donut{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.donut svg{width:128px;height:128px;flex:none}
.dl{display:flex;flex-direction:column;gap:9px;flex:1 1 130px;min-width:0}
.dl div{display:grid;grid-template-columns:10px 1fr auto;gap:8px;align-items:center;font-size:12.5px}
.dl b{font-family:var(--mono);font-weight:500}
.dl .dot{width:10px;height:10px;border-radius:3px}
.mix{display:flex;flex-direction:column;gap:16px}
.mx .lbl{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);margin-bottom:6px}
.stack{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--panel2);gap:2px}
.stack i{display:block;height:100%}
.yv{display:grid;grid-template-columns:160px minmax(0,1fr) 170px;gap:14px;align-items:center}
.yth{position:relative;display:block;aspect-ratio:16/9;max-width:100%;border-radius:8px;overflow:hidden;background:linear-gradient(135deg,var(--panel),var(--panel2));border:1px solid var(--line)}
.yth img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.yth .pl{position:absolute;inset:0;display:grid;place-items:center}
.yth .pl i{width:34px;height:24px;border-radius:7px;background:var(--yt);display:grid;place-items:center;font-style:normal;font-size:11px;color:#fff}
.yv .vb{display:flex;flex-direction:column;gap:5px}
.yv .vb b{font-family:var(--mono);font-weight:500;font-size:15px;text-align:right}
.yv .vb small{color:var(--muted);font-size:11px;text-align:right}
@media (max-width:760px){.yv{grid-template-columns:120px minmax(0,1fr)}.yv .vb{grid-column:1/-1}.yv .vb b,.yv .vb small{text-align:left}}
.mx .vals{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 10px;font-family:var(--mono);font-size:11.5px;margin-top:6px}
.tl{display:flex;flex-direction:column}
.tl .dy{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;position:relative;padding-bottom:10px}
.tl .dy::before{content:"";position:absolute;left:26px;top:34px;bottom:0;width:1px;background:var(--line)}
.tl .dy:last-child::before{display:none}
.tl .db{text-align:center;border:1px solid var(--line);border-radius:9px;padding:3px 0;background:var(--panel2);position:relative;align-self:start;line-height:1.25}
.tl .db small{display:block;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tl .db b{font-family:var(--mono);font-size:15px;font-weight:500}
.tl .dy.hoy .db{border-color:var(--red);box-shadow:0 0 0 3px var(--red-soft)}
.tl .ps{display:flex;flex-direction:column;gap:6px;min-width:0;padding-top:2px}
.tl .p{display:flex;gap:8px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-left:3px solid;border-radius:8px;padding:6px 10px;font-size:12.5px;min-width:0}
.tl .p .tx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl .p time{font-family:var(--mono);font-size:11px;color:var(--muted);flex:none}
.tl .free{color:var(--muted);font-size:12px;padding-top:9px}
.biz{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.bt{display:flex;gap:12px;align-items:center;justify-content:space-between;text-decoration:none;color:inherit}
.bt:hover{border-color:#3a3a44}
.bt>div{min-width:0}
.vz{flex:none}
.ring text{font-family:var(--mono);font-size:11px;fill:var(--fg)}
.ins{display:flex;flex-direction:column;gap:9px;margin:0;padding:0;list-style:none}
.ins li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:9px;align-items:start;font-size:13.5px;line-height:1.45}
.ins li i{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-style:normal;font-size:11px;font-family:var(--mono)}
.ins .g i{background:rgba(34,195,142,.12);color:var(--ok)}
.ins .b i{background:var(--red-soft);color:#ff6b78}
.ins .n i{background:var(--panel2);color:var(--muted)}
.cmp .fr{grid-template-columns:minmax(0,130px) 1fr 58px}
.cmp .fr.me span:first-child{color:#fff;font-weight:600}
.cmp .fr span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.steps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.step{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px}
.step .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;border:1px solid var(--line)}
.step.ok .n{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.step b{font-weight:600}
.nv{display:grid;grid-template-columns:minmax(0,1fr) 170px;gap:14px;align-items:center}
.nv .vb{display:flex;flex-direction:column;gap:5px}
.nv .vb b{font-family:var(--mono);font-weight:500;font-size:15px;text-align:right}
.nv .vb small{color:var(--muted);font-size:11px;text-align:right}
.acts{display:flex;flex-wrap:wrap;gap:6px}
@media (max-width:1300px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:1100px){.g3w{grid-template-columns:repeat(2,minmax(0,1fr))}.g3w>:last-child{grid-column:1/-1}}
@media (max-width:760px){.g3w,.steps,.nv{grid-template-columns:1fr}.g3w>:last-child{grid-column:auto}.nv .vb b,.nv .vb small{text-align:left}}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kt .big{font-size:21px}}
@media (prefers-reduced-motion:no-preference){
  .enter>*{animation:rise .45s cubic-bezier(.2,.7,.2,1) both}
  .enter>*:nth-child(2){animation-delay:.03s}.enter>*:nth-child(3){animation-delay:.06s}.enter>*:nth-child(4){animation-delay:.09s}.enter>*:nth-child(5){animation-delay:.12s}.enter>*:nth-child(6){animation-delay:.15s}.enter>*:nth-child(n+7){animation-delay:.18s}
  .enter .bar i,.enter .stack i{animation:grow .8s cubic-bezier(.2,.7,.2,1) both;transform-origin:left center}
  .enter .arc{animation:fade .9s ease both}
  @keyframes rise{from{opacity:.35;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes grow{from{transform:scaleX(.04)}to{transform:none}}
  @keyframes fade{from{opacity:.2}to{opacity:1}}
}

.live{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:3px 10px;background:var(--panel2)}
.live i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(34,195,142,.18)}
.live.off i{background:var(--warn);box-shadow:none}
.live.bad i{background:var(--red);box-shadow:none}
.err{border:1px solid rgba(225,29,46,.4);background:var(--red-soft);border-radius:10px;padding:10px 14px;font-size:12.5px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
a.lk{color:var(--fg);text-decoration:none;border-bottom:1px dotted var(--muted)}
a.lk:hover{color:#fff;border-color:var(--red)}
.mini{font-size:11px;padding:3px 8px}
.skel{color:var(--muted);font-family:var(--mono);font-size:12px}
/* ===== Kit de demo: barra superior, marca y recorrido guiado ===== */
:root{--k-accent:#C8231F;--k-accent-2:#9E1A17;--k-accent-soft:#FBEAEA;--k-ink:#0B0D12;--k-gray:#4A515C;--kbar-h:36px}
html[data-marca="blanca"]{--k-accent:#1D4E89;--k-accent-2:#153A66;--k-accent-soft:#E7EEF7}
body{padding-top:var(--kbar-h)}
.kbar{position:fixed;inset:0 0 auto 0;z-index:9000;background:#0B0D12;color:#E9EBEF;font:500 13px/1.3 Inter,system-ui,sans-serif;border-bottom:1px solid #22262E}
.kbar-in{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;padding:6px 16px;min-height:36px;box-sizing:border-box;max-width:1600px;margin:0 auto}
.kbar-msg{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.kbar-dot{width:7px;height:7px;border-radius:50%;background:#F5B83D;flex:none}
.kbar a,.kbar button{font:inherit;color:inherit}
.kbar .kcta{background:var(--k-accent);color:#fff;text-decoration:none;padding:4px 10px;border-radius:6px;font-weight:600;white-space:nowrap}
.kbar .kcta:hover{background:var(--k-accent-2)}
.kbar-tools{margin-left:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.kbar .klink{color:#E9EBEF;text-decoration:underline;text-underline-offset:3px}
.kbar .kbtn{background:transparent;border:1px solid #3A404B;border-radius:6px;padding:3px 9px;cursor:pointer;white-space:nowrap}
.kbar .kbtn:hover{border-color:#8A93A3}
.kseg{display:inline-flex;align-items:center;gap:6px;color:#AEB4BF}
.kseg span{white-space:nowrap}
.kseg-g{display:inline-flex;border:1px solid #3A404B;border-radius:6px;overflow:hidden}
.kseg-g button{background:transparent;border:0;padding:3px 8px;cursor:pointer;color:#C9CED6}
.kseg-g button[aria-pressed="true"]{background:#E9EBEF;color:#0B0D12;font-weight:600}
.kbar :focus-visible,.ktour-card :focus-visible{outline:2px solid #F5B83D;outline-offset:2px}
.kbar-in>*{flex:none}.kbr{display:none}.kbar-msg{order:1}.kcta{order:2}#kTourBtn{order:3;margin-left:auto}.kseg{order:4}.klink{order:5}
.kbtn .km{display:none}
@media (max-width:640px){.kbar{font-size:12px}.kbar-in{padding:5px 12px;gap:5px 8px}.klink{order:2}#kTourBtn{order:3}.kbr{display:block;order:4;flex-basis:100%;height:0}.kcta{order:5}.kseg{order:6;margin-left:auto}
 .kseg>span:first-child{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}.kseg-g button{padding:3px 7px;font-size:11.5px}.kbtn .kd{display:none}.kbtn .km{display:inline}.kbar .kcta{padding:3px 9px}}
main:focus,[tabindex="-1"]:focus{outline:none}
.klogo{display:inline-flex;align-items:center;gap:0;font:800 1em/1 "Inter Tight",Inter,system-ui,sans-serif;letter-spacing:-.01em;white-space:nowrap}
.klogo .r{color:#C8231F}
.klogo .km{margin-right:.45em;width:1.5em;height:1.5em;border-radius:.4em;background:var(--k-accent);display:inline-grid;place-items:center;color:#fff;font-size:.62em;letter-spacing:0}
html[data-marca="blanca"] .k-dvb-only{display:none!important}
html:not([data-marca="blanca"]) .k-white-only{display:none!important}
/* recorrido */
.ktour-shield{position:fixed;inset:0;z-index:9500;background:transparent;cursor:default}
.ktour-ring{position:fixed;z-index:9510;pointer-events:none;border-radius:10px;box-shadow:0 0 0 3px #F5B83D,0 0 0 9999px rgba(11,13,18,.28);transition:all .45s cubic-bezier(.3,.7,.2,1);opacity:0}
.ktour-cursor{position:fixed;z-index:9600;left:50%;top:50%;width:28px;height:28px;pointer-events:none;transition:left .75s cubic-bezier(.4,.1,.2,1),top .75s cubic-bezier(.4,.1,.2,1);filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.ktour-cursor.click::after{content:"";position:absolute;left:-14px;top:-14px;width:28px;height:28px;border-radius:50%;border:3px solid #F5B83D;animation:kclick .5s ease-out}
@keyframes kclick{from{transform:scale(.3);opacity:1}to{transform:scale(1.6);opacity:0}}
.ktour-cap{position:fixed;z-index:9700;left:50%;bottom:22px;transform:translateX(-50%);width:min(920px,calc(100% - 24px));box-sizing:border-box;background:rgba(11,13,18,.94);color:#fff;border-radius:14px;padding:16px 22px 16px 22px;font:600 clamp(17px,2.1vw,24px)/1.35 "Inter Tight",Inter,system-ui,sans-serif;box-shadow:0 12px 40px rgba(0,0,0,.35);display:flex;gap:14px;align-items:flex-start}
.ktour-cap .n{flex:none;font:700 13px/1 Inter,system-ui,sans-serif;background:var(--k-accent);border-radius:999px;padding:6px 9px;margin-top:3px}
.ktour-cap .t{flex:1}
.ktour-cap button{flex:none;background:transparent;border:1px solid #4A515C;color:#C9CED6;border-radius:8px;font:500 12px Inter,sans-serif;padding:5px 8px;cursor:pointer}
.ktour-end{position:fixed;inset:0;z-index:9800;display:grid;place-items:center;background:rgba(11,13,18,.72);padding:16px}
.ktour-card{background:#fff;color:#0B0D12;border-radius:20px;padding:36px 32px;max-width:520px;width:100%;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.4);font-family:Inter,system-ui,sans-serif}
.ktour-card h2{font:800 clamp(26px,4vw,36px)/1.15 "Inter Tight",Inter,sans-serif;margin:0 0 10px;letter-spacing:-.02em}
.ktour-card .big{font:800 clamp(28px,5vw,42px)/1 "Inter Tight",Inter,sans-serif;color:var(--k-accent);margin:14px 0 22px;letter-spacing:-.02em}
.ktour-card p{color:#4A515C;margin:0 0 6px;font-size:16px}
.ktour-card .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.ktour-card a,.ktour-card button{font:600 15px Inter,sans-serif;border-radius:10px;padding:11px 18px;cursor:pointer;text-decoration:none}
.ktour-card a{background:var(--k-accent);color:#fff;border:0}
.ktour-card button{background:#fff;border:1px solid #C3C8D1;color:#0B0D12}
@media print{.kbar,.ktour-cap,.ktour-cursor,.ktour-ring,.ktour-shield,.ktour-end{display:none!important}body{padding-top:0!important}}
html.ktour-on .toast{bottom:auto!important;top:calc(var(--kbar-h) + 72px)!important}

<script>
window.DEMO={product:"Panel de Contenido"};
/* ===== Kit de demo: barra superior, marca y recorrido guiado ===== */
const KIT=(()=>{
  const Q=new URLSearchParams(location.search);
  const white=Q.get("marca")==="blanca";
  const showSel=!white||Q.get("selector")==="1";
  const product=(window.DEMO&&DEMO.product)||"Demo";
  const SITE="https://www.devisebit.com/";
  const contact=SITE+"contacto?tema="+encodeURIComponent("Demo: "+product)+"#formulario";
  const brandName=white?"Tu Marca":"DEVISEBIT";
  document.documentElement.dataset.marca=white?"blanca":"devisebit";
  const accent=white?"#1D4E89":"#C8231F";
  const logo=(sub)=>white
    ?`<span class="klogo"><span class="km" aria-hidden="true">TM</span><span>Tu Marca</span></span>`
    :`<span class="klogo" aria-label="DEVISEBIT"><span>DEVISE</span><span class="r">BIT</span></span>`;
  const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  function url(over){const q=new URLSearchParams(location.search);for(const k in over){if(over[k]==null)q.delete(k);else q.set(k,over[k])}const s=q.toString();return location.pathname+(s?"?"+s:"")+location.hash}
  function bar(){
    const b=document.createElement("div");b.className="kbar";b.setAttribute("role","region");b.setAttribute("aria-label","Aviso de demo");
    const sel=showSel?`<span class="kseg"><span id="kselLbl">Marca:</span><span class="kseg-g" role="group" aria-labelledby="kselLbl"><button type="button" data-kbrand="devisebit" aria-pressed="${!white}">DEVISEBIT</button><button type="button" data-kbrand="blanca" aria-pressed="${white}">Tu marca</button></span></span>`:"";
    b.innerHTML=`<div class="kbar-in"><div class="kbar-msg"><span class="kbar-dot" aria-hidden="true"></span><span>Demo con datos de ejemplo${white?"":" ·"}</span></div>${white?"":`<a class="kcta" href="${contact}">Quiero esto para mi organización</a>`}<button type="button" class="kbtn" id="kTourBtn">▶ <span class="kd">Ver recorrido guiado</span><span class="km">Recorrido</span></button><span class="kbr" aria-hidden="true"></span>${sel}${white?"":`<a class="klink" href="${SITE}">Inicio</a>`}</div>`;
    document.body.prepend(b);
    b.querySelectorAll("[data-kbrand]").forEach(x=>x.onclick=()=>{const v=x.dataset.kbrand;location.href=url({marca:v==="blanca"?"blanca":null,selector:v==="blanca"?"1":Q.get("selector")})});
    b.querySelector("#kTourBtn").onclick=()=>{location.href=url({tour:"1"})};
    const fit=()=>document.documentElement.style.setProperty("--kbar-h",b.offsetHeight+"px");
    fit();addEventListener("resize",fit);if(window.ResizeObserver)new ResizeObserver(fit).observe(b);
    if(Q.get("tour")==="1")b.querySelector("#kTourBtn").hidden=true;
  }
  function applyBrand(root=document){
    root.querySelectorAll("[data-k-logo]").forEach(e=>e.innerHTML=logo());
    root.querySelectorAll("[data-k-name]").forEach(e=>e.textContent=brandName);
  }
  /* ---------- recorrido guiado ---------- */
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  let cur,ring,cap,shield,stopped=false,total=0,idx=0,ringEl=null,raf=0;
  const cursorSVG=`<svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path d="M3 2l7.5 19 2.6-7.9L21 10.5z" fill="#fff" stroke="#0B0D12" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
  function el(sel){return typeof sel==="string"?document.querySelector(sel):sel}
  function track(){if(ring&&ringEl&&!ringEl.isConnected)ring.style.opacity=0;else if(ringEl&&ring){const r=ringEl.getBoundingClientRect();Object.assign(ring.style,{left:r.left-6+"px",top:r.top-6+"px",width:r.width+12+"px",height:r.height+12+"px",opacity:r.width?1:0})}raf=requestAnimationFrame(track)}
  async function show(sel,opt={}){
    const e=el(sel);if(!e)return null;
    const r0=e.getBoundingClientRect(),capH=cap?cap.offsetHeight+40:120;
    if(r0.top<parseInt(getComputedStyle(document.documentElement).getPropertyValue("--kbar-h"))+10||r0.bottom>innerHeight-capH){e.scrollIntoView({block:opt.block||"center",behavior:"smooth"});await sleep(650)}
    {const r1=e.getBoundingClientRect();if(r1.left<0||r1.right>innerWidth){e.scrollIntoView({block:"nearest",inline:"center",behavior:"smooth"});await sleep(500)}}
    ringEl=opt.ring===false?null:e;if(!ringEl&&ring)ring.style.opacity=0;
    const r=e.getBoundingClientRect();cur.style.transitionDuration=(opt.wait?opt.wait*.85/1000:.75)+"s";
    cur.style.left=Math.min(innerWidth-30,r.left+Math.min(r.width/2,r.width-8))+"px";cur.style.top=r.top+Math.min(r.height/2,22)+"px";
    await sleep(opt.wait||800);return e;
  }
  async function click(sel,opt){const e=await show(sel,opt);if(!e)return;cur.classList.remove("click");void cur.offsetWidth;cur.classList.add("click");await sleep(180);e.focus&&e.focus({preventScroll:true});e.click();await sleep(350);return e}
  async function type(sel,text,opt={}){
    const e=await show(sel,opt);if(!e)return;e.focus({preventScroll:true});
    const proto=e.tagName==="TEXTAREA"?HTMLTextAreaElement.prototype:HTMLInputElement.prototype;const set=Object.getOwnPropertyDescriptor(proto,"value").set;
    set.call(e,"");e.dispatchEvent(new Event("input",{bubbles:true}));
    for(const ch of text){set.call(e,e.value+ch);e.dispatchEvent(new Event("input",{bubbles:true}));await sleep(opt.speed||55)}
    e.dispatchEvent(new Event("change",{bubbles:true}));await sleep(250);return e;
  }
  async function pick(sel,value){const e=await show(sel);if(!e)return;e.value=value;e.dispatchEvent(new Event("input",{bubbles:true}));e.dispatchEvent(new Event("change",{bubbles:true}));await sleep(300);return e}
  function say(t){idx++;cap.querySelector(".n").textContent=idx+" / "+total;cap.querySelector(".t").textContent=t}
  function end(){
    cancelAnimationFrame(raf);document.documentElement.classList.remove("ktour-on");[cur,ring,cap,shield].forEach(x=>x&&x.remove());
    const o=document.createElement("div");o.className="ktour-end";o.setAttribute("role","dialog");o.setAttribute("aria-modal","true");o.setAttribute("aria-labelledby","kEndT");
    o.innerHTML=white
      ?`<div class="ktour-card"><h2 id="kEndT">Pedí tu demo</h2><p>Lo armamos con tus datos y tu marca.</p><div class="big">${esc(product)}</div><div class="row"><button type="button" id="kEndBack">Seguir explorando</button></div></div>`
      :`<div class="ktour-card"><h2 id="kEndT">¿Lo querés para tu organización?</h2><p>Lo adaptamos a tu marca, tus datos y tu equipo.</p><div class="big">devisebit.com</div><div class="row"><a href="${contact}">Quiero esto para mi organización</a><button type="button" id="kEndBack">Seguir explorando</button></div></div>`;
    document.body.appendChild(o);o.querySelector("#kEndBack").onclick=()=>{o.remove();history.replaceState(null,"",url({tour:null}));const t=document.getElementById("kTourBtn");if(t)t.hidden=false};
    o.querySelector("#kEndBack").focus({preventScroll:true});
    window.__tourDone=true;
  }
  async function run(steps){
    window.__tourDone=false;total=steps.length;idx=0;
    shield=document.createElement("div");shield.className="ktour-shield";shield.title="Recorrido en curso";
    ring=document.createElement("div");ring.className="ktour-ring";
    cur=document.createElement("div");cur.className="ktour-cursor";cur.innerHTML=cursorSVG;
    cap=document.createElement("div");cap.className="ktour-cap";cap.setAttribute("role","status");cap.setAttribute("aria-live","polite");
    cap.innerHTML=`<span class="n"></span><span class="t"></span><button type="button">Salir</button>`;
    document.body.append(shield,ring,cur,cap);document.documentElement.classList.add("ktour-on");track();
    cap.querySelector("button").onclick=()=>{stopped=true};
    addEventListener("keydown",e=>{if(e.key==="Escape")stopped=true});
    const T={show,click,type,pick,sleep,el};
    for(const s of steps){
      if(stopped)break;
      say(s.say);const t0=Date.now();
      try{await s.do(T)}catch(e){console.warn("tour",e)}
      const left=(s.hold||3000)-(Date.now()-t0);if(left>0)await sleep(left);
    }
    end();
  }
  function init(steps){
    bar();applyBrand();
    if(Q.get("tour")==="1")setTimeout(()=>run(typeof steps==="function"?steps():steps),700);
  }
  return {white,brandName,contact,SITE,logo,applyBrand,init,run,esc,accent};
})();

const SRV="Metricool Social Media Management", BRAND="demo", TZ="America/Buenos_Aires", POLL=300000;
const VER="Vercel", SYS_BASE="https://sistema.estudioandes.demo/api/panel?k=";
const BUF="Buffer", BORG="demo", BCH="demo", BPOLL=1800000;
const ST={idea:{n:"Idea",d:"var(--muted)"},borr:{n:"Borrador",d:"var(--warn)"},prog:{n:"Programado",d:"var(--info)"},pub:{n:"Publicado",d:"var(--ok)"}};
const TIPOS=["Carrusel","Reel","Placa","Historia","Post LinkedIn","Nota de blog"];
const NETS={instagram:"Instagram",linkedin:"LinkedIn",facebook:"Facebook",tiktok:"TikTok",youtube:"YouTube"};
const NC={instagram:"var(--ig)",linkedin:"var(--li)",facebook:"var(--info)",tiktok:"var(--tt)",youtube:"var(--yt)"};
const S={range:30,evo:null,prev:null,posts:null,sched:null,igPosts:null,igSched:null,liPosts:null,liSched:null,li:null,sys:null,comp:null,err:{},at:{},ideas:[],rivals:[],news:[],fuentes:[],pend:[],src:"…",canWrite:true,isOwner:false,cache:null};
let mcp=null,db=null,user=null;const unsub={};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>v==null||v===""?null:Number(v);
const fmt=n=>n==null||isNaN(n)?"—":Math.abs(n)>=1e6?(n/1e6).toFixed(1)+"M":Math.abs(n)>=1e4?(n/1e3).toFixed(1).replace(".0","")+"K":Math.round(n).toLocaleString("es-AR");
const sum=a=>a.reduce((x,y)=>x+(y||0),0);
const pad=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;

const fdate=s=>{if(!s)return"Sin fecha";const d=new Date(s.length<=10?s+"T12:00":s);return isNaN(d)?s:d.toLocaleDateString("es-AR",{day:"2-digit",month:"short"}).replace(".","").toUpperCase()};
const ftime=s=>{const d=new Date(s);return isNaN(d)?"":d.toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"})};
const ago=t=>{if(!t)return"";const m=Math.round((Date.now()-t)/60000);return m<1?"recién":m<60?`hace ${m} min`:m<1440?`hace ${Math.round(m/60)} h`:`hace ${Math.round(m/1440)} d`};
function toast(m,bad){const t=$("#toast");t.textContent=m;t.style.borderLeftColor=bad?"var(--red)":"var(--ok)";t.hidden=false;clearTimeout(t._t);t._t=setTimeout(()=>t.hidden=true,2800)}
function today(){return new Date()}
function dayOff(n){const d=today();d.setDate(d.getDate()+n);return d}
const T0=s=>s+"T00:00:00-03:00", T1=s=>s+"T23:59:59-03:00";

/* ---------- Metricool en vivo ---------- */
function errMsg(x){
  const e=x&&x.e?x.e:x,sv=x&&x.srv===BUF?"Buffer":x&&x.srv===VER?"Vercel":"Metricool";

function _errMsg(e){
  switch(e&&e.code){
    case"needs_reauth":return"Metricool pidió volver a iniciar sesión. Reconectalo en claude.ai → Configuración → Conectores.";
    case"server_not_connected":case"selection_required":return"Metricool no está conectado en tu cuenta. Agregalo en claude.ai → Configuración → Conectores.";
    case"not_in_manifest":case"blocked_by_policy":return"Esta página no tiene permiso para leer Metricool. Habilitalo desde el menú Permisos del panel.";
    case"approval_required":return"Falta tu aprobación para leer Metricool.";
    case"tool_error":return"Metricool respondió con un error: "+(e.message||"").slice(0,140);
    default:return"Metricool no respondió. Se reintenta solo; mostramos lo último disponible.";

function watch(key,tool,input,onData,srv=SRV,poll=POLL){

    if(ev.type==="data"){S.err[key]=null;S.at[key]=ev.result.cache?ev.result.cache.storedAt:Date.now();onData(ev.result.payload);saveCache()}
    else{S.err[key]={e:ev.error,srv,retry:ev.error.code==="approval_required"?run:null};if(DENY.includes(ev.error.code))onData(null,true)}

function lineSVG(sets,dates,w,h,label){

  const seen=new Set();

  }

    else{const top=byE[0];tk.push({c:"b",t:`Tu engagement (${fe(eng)}) está por debajo del promedio de la competencia (${fe(o.avgE)}).${top&&!top.me?` Mirá qué publica ${top.name}, que lidera con ${fe(top.eng)}.`:""}`})}

}
function cmpBars(list,f,fm){
  const l=list.filter(x=>x[f]!=null).sort((a,b)=>b[f]-a[f]),mx=Math.max(1e-9,...l.map(x=>x[f]));
  return l.length?`<div class="flow cmp">${l.map(x=>`<div class="fr ${x.me?'me':''}"><span title="${esc(x.name)}">${esc(x.name)}</span><div class="bar"><i style="width:${Math.max(1.5,x[f]/mx*100)}%;background:${x.me?'var(--red)':'var(--muted)'}"></i></div><span style="font-family:var(--mono);text-align:right">${fm(x[f])}</span></div>`).join("")}</div>`:`<div class="empty">Sin datos todavía.</div>`;
}
const insList=tk=>`<ul class="ins">${tk.map(x=>`<li class="${x.c}"><i>${x.c=="g"?"▲":x.c=="b"?"▼":"•"}</i><span>${esc(x.t)}</span></li>`).join("")}</ul>`;
function compEmpty(){
  const n=S.rivals.length,wi=S.rivals.filter(r=>handle(r.ig)).length;
  return `<div class="card"><div class="ch"><h2>Informe de competencia</h2><span class="k">faltan datos</span></div>
   <p class="sub" style="margin:0 0 12px">El informe compara tus seguidores y tu engagement con las cuentas que seguís, y te dice en qué puesto estás. Para armarlo hacen falta dos pasos:</p>
   <div class="steps">
    <div class="step ${wi?'ok':''}"><span class="n">${wi?'✓':'1'}</span><div><b>Cargá las cuentas acá</b><p class="sub">Con “Añadir cuenta”, poniendo su usuario de Instagram.${n?` Ya cargaste ${n}, ${wi} con usuario de Instagram.`:""}</p></div></div>
    <div class="step"><span class="n">2</span><div><b>Sumá los mismos usuarios al seguimiento</b><p class="sub">En Ajustes → <b>Competidores</b>, agregá cada usuario. Puede tardar hasta un día en traer los datos; después el informe se arma solo.</p></div></div>
   </div></div>`;
}
function compPanel(){
  if(S.comp==null&&!S.err.comp)return `<div class="skel">Leyendo la competencia…</div>`;
  const d=compData();if(!d.n)return compEmpty();
  const t=(k,v,sub,col)=>`<div class="card kt"><div class="k">${k}</div><div class="big"${col?` style="color:${col}"`:""}>${v}</div><div class="ft">${sub}</div></div>`;
  return `<div class="grid g4">
    ${t("Tu puesto en seguidores",d.rank?`${d.rank}.º <span style="font-size:15px;color:var(--muted)">de ${d.byF.length}</span>`:"—",d.rank?`${fmt(d.us.fol)} seguidores`:"falta leer tus seguidores",d.rank===1?"var(--ok)":"")}
    ${t("Distancia al líder",d.rank===1?"Sos el líder":d.rank&&d.us.fol?`${xr(d.leader.fol/d.us.fol)}×`:"—",d.rank===1?"nadie te supera en seguidores":d.leader?`${esc(d.leader.name)} · ${fmt(d.leader.fol)}`:"")}
    ${t("Promedio de la competencia",fmt(d.avgF),`seguidores · ${d.n} ${d.n==1?"cuenta":"cuentas"} con datos`)}
    ${t("Engagement: vos / ellos",`${fe(d.us.eng)} <span style="font-size:15px;color:var(--muted)">/ ${fe(d.avgE)}</span>`,d.rankE?`${d.rankE}.º de ${d.byE.length} en engagement`:"—",d.us.eng!=null&&d.avgE!=null?(d.us.eng>=d.avgE?"var(--ok)":"var(--red)"):"")}
   </div>
   <div class="grid g2">
    <div class="card"><div class="ch"><h2>Seguidores en Instagram</h2><span class="legend"><span><i class="dot" style="background:var(--red)"></i> Vos</span></span></div>${cmpBars([d.us,...d.riv],"fol",fmt)}</div>
    <div class="card"><div class="ch"><h2>Engagement</h2><span class="k">por cada 1.000 seguidores</span></div>${cmpBars([d.us,...d.riv],"eng",fe)}</div>
   </div>
   <div class="card"><div class="ch"><h2>Qué dice el informe</h2><span class="k">últimos 30 días</span></div>${insList(d.tk)}
    <p class="sub" style="margin-top:10px;font-size:11.5px">Engagement: interacciones promedio por publicación cada 1.000 seguidores. El tuyo sale de tus publicaciones de Instagram de los últimos 30 días.</p></div>`;
}
function compMini(){
  const head=`<div class="ch"><h2>Competencia</h2><a class="k" href="#competencia" style="color:var(--muted)">Ver informe ›</a></div>`;
  if(S.comp==null&&!S.err.comp)return `<div class="card">${head}<div class="skel">Leyendo…</div></div>`;
  const d=compData();
  if(!d.n)return `<div class="card">${head}<p class="sub" style="margin:0">Todavía no hay datos para comparar. Cargá las cuentas en Competencia y sumá los mismos usuarios en <b style="color:var(--fg)">Ajustes → Competidores</b>.</p><div class="row" style="margin-top:12px"><a class="btn mini" href="#competencia">Cómo armar el informe</a></div></div>`;
  return `<div class="card">${head}<div class="bt" style="margin-bottom:12px"><div><div class="k">Tu puesto en seguidores</div><div class="big">${d.rank?`${d.rank}.º <span style="font-size:14px;color:var(--muted)">de ${d.byF.length}</span>`:"—"}</div></div><div style="text-align:right"><div class="k">Engagement vs. promedio</div><div class="big" style="color:${d.us.eng!=null&&d.avgE!=null?(d.us.eng>=d.avgE?'var(--ok)':'var(--red)'):'var(--fg)'}">${d.us.eng!=null&&d.avgE?(d.us.eng>=d.avgE?"+":"−")+Math.abs(Math.round((d.us.eng-d.avgE)/d.avgE*100))+"%":"—"}</div></div></div>${insList(d.tk.slice(0,2))}</div>`;
}

function liCard(full){
  const l=S.li;
  if(!l)return `<div class="card"><div class="ch"><span style="display:flex;gap:7px;align-items:center;font-weight:500"><i class="dot" style="background:var(--li)"></i>LinkedIn · Estudio Andes</span><span class="k">LinkedIn</span></div>${S.err.liAgg?`<p class="sub">${esc(errMsg(S.err.liAgg))}</p>`:`<div class="skel">Leyendo LinkedIn…</div>`}</div>`;
  const cell=(k,v)=>`<div><div class="k">${k}</div><div class="big" style="font-size:${full?22:19}px">${v}</div></div>`;
  return `<div class="card"><div class="ch"><span style="display:flex;gap:7px;align-items:center;font-weight:500"><i class="dot" style="background:var(--li)"></i>LinkedIn · Estudio Andes</span><span class="k">${l.days} días</span></div>
   <div class="grid g4" style="gap:10px">${cell("Impresiones",fmt(l.impr))}${cell("Alcance",fmt(l.reach))}${cell("Reacciones",fmt((l.react||0)+(l.comm||0)+(l.shares||0)))}${cell("Engagement",l.eng==null?"—":l.eng.toFixed(1)+"%")}</div>
   <p class="sub" style="margin-top:8px">${fmt(l.posts)} posts publicados${l.upd?` · métricas de LinkedIn al ${new Date(l.upd).toLocaleString("es-AR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}`:""}${full&&S.range>31?" · LinkedIn muestra hasta 31 días":""}</p></div>`;
}
const netTag=n=>`<span class="tag"><i class="dot" style="background:${NC[n]||'var(--ig)'}"></i>${NETS[n]||n||"Instagram"}</span>`;

const V={};
V.inicio=()=>{
  const k=kpi(),e=S.evo||[],hasP=!!(S.prev&&S.prev.length),sch=S.sched||[],posts=S.posts||[],l=S.li;
  const h=today().getHours(),hi=h<13?"Buen día":h<20?"Buenas tardes":"Buenas noches";
  const nIdeas=S.ideas.filter(i=>i.st==="idea").length,nBorr=S.ideas.filter(i=>i.st==="borr").length;
  const pubR=S.posts==null?null:posts.filter(p=>ymd(p.ts)>=iso(dayOff(-(S.range-1)))).length;
  const er=k.reach?k.inter/k.reach*100:null,erP=k.reachP?k.interP/k.reachP*100:null;
  const ev=S.evo!=null;
  const tile=(lab,src,val,chip,sp,ft)=>`<div class="card kt"><div class="top"><span class="k">${lab}</span>${chip}</div><div class="big">${val}</div><div class="ft">${ft}</div>${sp}<span class="src">${src}</span></div>`;
  const igS=`<span><i class="dot" style="background:var(--ig)"></i></span>Instagram`,liS=`<span><i class="dot" style="background:var(--li)"></i></span>LinkedIn`;
  const liReact=l?(l.react||0)+(l.comm||0)+(l.shares||0):null;
  const kpis=`<div class="kpis">
   ${tile("Seguidores",igS,ev?fmt(k.fol):"—",k.folDelta!=null?`<span class="dc ${k.folDelta>0?'up':k.folDelta<0?'dn':''}">${k.folDelta>0?'+':''}${fmt(k.folDelta)}</span>`:`<span class="dc">—</span>`,spark(e.map(r=>r.fol),"var(--ig)"),`en ${S.range} días`)}
   ${tile("Alcance",igS,ev?fmt(k.reach):"—",dchip(ev?k.reach:null,k.reachP,hasP),spark(e.map(r=>r.reach),"var(--red)"),"cuentas alcanzadas")}
   ${tile("Interacciones",igS,ev?fmt(k.inter):"—",dchip(ev?k.inter:null,k.interP,hasP),spark(e.map(r=>r.inter),"var(--ok)"),"me gusta, comentarios y más")}
   ${tile("Interacción / alcance",igS,er==null?"—":er.toFixed(1)+"%",er!=null&&erP!=null?`<span class="dc ${er>=erP?'up':'dn'}" title="vs. ${S.range} días previos">${er>=erP?'▲':'▼'} ${Math.abs(er-erP).toFixed(1)} pts</span>`:`<span class="dc">—</span>`,spark(e.map(r=>r.reach?r.inter/r.reach*100:null),"var(--warn)"),"cuánto engancha lo que ve la gente")}
   ${tile("Impresiones",liS,l?fmt(l.impr):"—",`<span class="dc">${l?l.days+" d":"…"}</span>`,`<div class="sp"></div>`,l?`${fmt(l.posts)} posts · alcance ${fmt(l.reach)}`:(S.err.liAgg?"sin conexión":"leyendo…"))}
   ${tile("Engagement",liS,l&&l.eng!=null?l.eng.toFixed(1)+"%":"—",`<span class="dc">${l?l.days+" d":"…"}</span>`,`<div class="sp"></div>`,l?`${fmt(liReact)} reacciones, comentarios y compartidos`:"—")}
  </div>`;
  const flow=[{n:"Ideas",v:nIdeas,c:"var(--muted)"},{n:"Borradores",v:nBorr,c:"var(--warn)"},{n:"Programados",v:S.sched==null?0:sch.length,c:"var(--info)"},{n:`Publicados (${S.range} d)`,v:pubR||0,c:"var(--ok)"}];
  const flowCard=`<div class="card"><div class="ch"><h2>Flujo de contenido</h2><a class="k" href="#publicaciones" style="color:var(--muted)">Publicaciones ›</a></div>
   <div class="donut">${donut(flow,"Piezas por estado")}<div class="dl">${flow.map((f,i)=>`<div><i class="dot" style="background:${f.c}"></i><span>${f.n}</span><b>${i==2&&S.sched==null||i==3&&pubR==null?"…":f.v}</b></div>`).join("")}</div></div></div>`;
  const yt=S.sys&&S.sys.youtube,ytV=yt&&yt.vistas30!=null?yt.vistas30:null,ytP=yt&&yt.publicados30!=null?yt.publicados30:null;
  const IG=v=>({s:"IG",n:"Instagram",c:"var(--ig)",v}),LI=v=>({s:"LI",n:"LinkedIn",c:"var(--li)",v}),YT=v=>({s:"YT",n:"YouTube",c:"var(--yt)",v});
  const pair=(lab,it)=>{const kn=it.filter(x=>x.v!=null),t=sum(kn.map(x=>x.v));
    if(!kn.length)return `<div class="mx"><div class="lbl"><span>${lab}</span><span>—</span></div><div class="stack"></div></div>`;
    return `<div class="mx"><div class="lbl"><span>${lab}</span><span>${fmt(t)} en total</span></div><div class="stack" role="img" aria-label="${lab}: ${it.map(x=>x.n+" "+fmt(x.v)).join(", ")}">${t?kn.filter(x=>x.v>0).map(x=>`<i style="width:${x.v/t*100}%;background:${x.c}"></i>`).join(""):""}</div>
     <div class="vals">${it.map(x=>`<span style="color:${x.c}">${x.s} ${fmt(x.v)}${t&&x.v!=null?` · ${Math.round(x.v/t*100)}%`:""}</span>`).join("")}</div></div>`};
  const mixCard=`<div class="card"><div class="ch"><h2>Mezcla de canales</h2><span class="legend"><span><i class="dot" style="background:var(--ig)"></i> Instagram</span><span><i class="dot" style="background:var(--li)"></i> LinkedIn</span>${yt?`<span><i class="dot" style="background:var(--yt)"></i> YouTube</span>`:""}</span></div>
   <div class="mix">${pair("Alcance",[IG(ev?k.reach:null),LI(l?l.reach:null)])}${pair("Interacciones",[IG(ev?k.inter:null),LI(liReact)])}${ytV!=null?pair("Visualizaciones",[IG(ev?k.views:null),YT(ytV)]):""}${pair("Publicaciones",yt?[IG(ev?k.count:null),LI(l?l.posts:null),YT(ytP)]:[IG(ev?k.count:null),LI(l?l.posts:null)])}</div>
   <p class="sub" style="margin-top:10px;font-size:11.5px">Instagram: ${S.range} días. LinkedIn: ${l?l.days:Math.min(S.range,31)} días.${yt?" YouTube: 30 días.":""}</p></div>`;
  const td=iso(today()),wd=["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
  const days=[0,1,2,3,4,5,6].map(i=>{const d=dayOff(i),kk=iso(d);return{d,kk,l:sch.filter(p=>(p.dt||"").slice(0,10)===kk)}});
  const n7=sum(days.map(x=>x.l.length));
  const tl=`<div class="card"><div class="ch"><h2>Próximos 7 días</h2><span class="row" style="gap:10px"><span class="k">${S.sched==null?"…":n7+" programadas"}</span><a class="k" href="#calendario" style="color:var(--muted)">Calendario ›</a></span></div>
   ${S.sched==null?`<div class="skel">Leyendo programados…</div>`:`<div class="tl">${days.map(x=>`<div class="dy ${x.kk==td?'hoy':''}"><div class="db"><small>${x.kk==td?"Hoy":wd[x.d.getDay()]}</small><b>${x.d.getDate()}</b></div><div class="ps">${x.l.length?x.l.map(p=>`<div class="p" style="border-left-color:${NC[p.net]||'var(--ig)'}"><time>${ftime(p.dt)}</time><span class="tx" title="${esc(p.text)}">${esc(p.text.split("\n")[0].slice(0,120))}</span><span class="tag">${esc(p.type)}</span></div>`).join(""):`<div class="free">Sin publicaciones</div>`}</div></div>`).join("")}</div>`}</div>`;
  const last=`<div class="card"><div class="ch"><h2>Últimas publicaciones</h2><a class="k" href="#analisis" style="color:var(--muted)">Análisis ›</a></div><div class="list">
    ${S.posts==null?`<div class="skel">Leyendo publicaciones…</div>`:posts.length?posts.slice(0,5).map(p=>`<div class="item"><div class="t">${p.url?`<a class="lk" href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.text.split("\n")[0].slice(0,100))}</a>`:esc(p.text.slice(0,100))}</div><div class="m"><span>${fdate(ymd(p.ts))} · ${NETS[p.net]||"Instagram"}</span><span>Alc. ${fmt(p.reach)} · ${fmt(p.inter)} int.</span></div></div>`).join(""):`<div class="empty">Sin publicaciones en los últimos 90 días.</div>`}
   </div></div>`;
  return `<div class="head"><div><h1>${hi}, equipo</h1><p class="sub">Panorama de Estudio Andes: redes, negocio y web.</p></div><div class="row">${liveTag()}<a class="btn pri" href="#publicaciones">+ Nueva idea</a></div></div>
  ${errBanner(["evo","sched","feed","liPosts"])}${noMcpNote()}
  <div class="sec"><span class="k">Redes · últimos ${S.range} días</span></div>
  ${kpis}
  <div class="g3w">${flowCard}${mixCard}${compMini()}</div>
  <div class="grid g2">${tl}${last}</div>
  ${panorama()}
  ${pendientes()}`;
};
