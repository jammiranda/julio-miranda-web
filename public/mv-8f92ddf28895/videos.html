<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Biblioteca de contenidos · DEVISEBIT</title>
<!--
  Esta página se arma sola a partir de biblioteca.json (misma carpeta).
  Para sumar un mes o una pieza: agregar entradas en "piezas" de ese archivo.
  No hace falta tocar este HTML.
-->
<style>
:root{--f:#0f1319;--s:#171c24;--b:#2a313c;--t:#eef1f5;--m:#a3acb9;--r:#e0262d}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--f);color:var(--t);overflow-wrap:break-word}
main{max-width:1100px;margin:0 auto;padding:28px 16px 70px}
h1{font-size:1.7rem;line-height:1.2;margin:0;text-wrap:balance}
h1 span{color:var(--r)}
header p{color:var(--m);max-width:62ch;margin:8px 0 0}
.barra{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 0}
.barra button,.meses a{min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--b);background:transparent;color:var(--t);font:inherit;font-weight:600;font-size:.95rem;cursor:pointer;display:inline-flex;align-items:center;text-decoration:none}
.barra button[aria-pressed="true"]{background:var(--r);border-color:var(--r);color:#fff}
.meses{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0;align-items:center}
.meses span{color:var(--m);font-size:.9rem;margin-right:4px}
.meses a{font-weight:400;font-size:.9rem;padding:0 14px}
.mes{margin-top:40px;scroll-margin-top:12px}
.mes>h2{font-size:1.45rem;margin:0;padding-bottom:10px;border-bottom:1px solid var(--b);display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.mes>h2 small{font-size:.9rem;font-weight:400;color:var(--m)}
.serie h3{font-size:1.1rem;margin:26px 0 2px}
.serie .nota{color:var(--m);margin:0;font-size:.93rem;max-width:70ch}
.g{display:grid;gap:14px;margin-top:14px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.g.c{grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:18px}
figure{margin:0;min-width:0;background:var(--s);border:1px solid var(--b);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
video{width:100%;height:auto;display:block;background:#000}
figcaption{padding:10px 12px 12px;display:flex;flex-direction:column;gap:10px;flex:1;justify-content:space-between}
figcaption strong{font-size:.92rem;line-height:1.3}
.btn{min-height:44px;display:inline-flex;align-items:center;justify-content:center;padding:0 12px;border-radius:9px;border:1px solid var(--r);background:var(--r);color:#fff;font:inherit;font-weight:600;font-size:.88rem;text-decoration:none;text-align:center;cursor:pointer}
.btn.s{background:transparent;border-color:var(--b)}
.btn[disabled]{opacity:.6;cursor:progress}
.d{display:flex;gap:8px;flex-wrap:wrap}
.d .btn{flex:1 1 130px}
:focus-visible{outline:2px solid #fff;outline-offset:2px}

/* Carrusel: las placas van pegadas, sin separación ni bordes entre ellas */
.visor{position:relative;background:#000}
.pista{display:flex;gap:0;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x mandatory;scroll-behavior:smooth;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.pista::-webkit-scrollbar{display:none}
.pista:focus-visible{outline:2px solid #fff;outline-offset:-2px}
.pista img{flex:0 0 100%;width:100%;height:auto;display:block;scroll-snap-align:start;scroll-snap-stop:always;border-radius:0;margin:0}
.fl{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(15,19,25,.82);color:#fff;font:inherit;font-size:1.5rem;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0 0 3px}
.fl.a{left:8px}.fl.p{right:8px}
.fl[disabled]{opacity:0;pointer-events:none}
.fl:hover{background:var(--r);border-color:var(--r)}
@media (hover:none){.fl{display:none}}
.pie{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px 0}
.puntos{display:flex;gap:6px;flex-wrap:wrap}
.puntos i{width:7px;height:7px;border-radius:50%;background:var(--b)}
.puntos i.on{background:var(--r)}
.cuenta{color:var(--m);font-size:.85rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.vo{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.aviso{margin-top:30px;color:var(--m)}
footer{margin-top:48px;padding-top:18px;border-top:1px solid var(--b);color:var(--m);font-size:.9rem}
footer a{color:var(--t);display:inline-flex;align-items:center;min-height:44px}
@media(min-width:700px){.g{grid-template-columns:repeat(5,1fr)}.g.c{grid-template-columns:repeat(3,1fr)}}
@media (prefers-reduced-motion:reduce){html,.pista{scroll-behavior:auto}}
</style>
</head>
<body>
<main>
<header>
<h1>DEVISE<span>BIT</span> · Biblioteca de contenidos</h1>
<p>Nuestros videos y carruseles para redes, mes a mes. Tocá un video para verlo, deslizá los carruseles y descargá lo que quieras compartir.</p>
<div class="barra" role="group" aria-label="Filtrar por tipo de pieza">
<button type="button" data-f="todo" aria-pressed="true">Todo</button>
<button type="button" data-f="video" aria-pressed="false">Videos</button>
<button type="button" data-f="carrusel" aria-pressed="false">Carruseles</button>
</div>
<nav class="meses" id="meses" aria-label="Ir a un mes" hidden></nav>
</header>
<div id="lista"><p class="aviso">Cargando la biblioteca…</p></div>
<noscript><p class="aviso">Para ver la biblioteca necesitás tener JavaScript activado en el navegador.</p></noscript>
<footer>DEVISEBIT SRL · <a href="https://www.devisebit.com">www.devisebit.com</a></footer>
</main>
<script>
(function(){
'use strict';
var MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
var lista=document.getElementById('lista'),nav=document.getElementById('meses');
var datos={piezas:[],notas:{}},filtro='todo';
var quieto=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

function el(tag,attrs,hijos){
  var e=document.createElement(tag),k;
  for(k in attrs||{}){
    if(k==='text')e.textContent=attrs[k];
    else if(k==='class')e.className=attrs[k];
    else if(attrs[k]===true)e.setAttribute(k,'');
    else if(attrs[k]!==false&&attrs[k]!=null)e.setAttribute(k,attrs[k]);
  }
  (hijos||[]).forEach(function(h){if(h)e.appendChild(h)});
  return e;
}
function nombreMes(m){var p=String(m).split('-');return (MESES[+p[1]-1]||m)+' '+p[0]}
function cuantas(n,uno,muchos){return n+' '+(n===1?uno:muchos)}
function razon(f){var p=String(f||'').split(':');return (+p[0]>0&&+p[1]>0)?p[0]+' / '+p[1]:null}
function archivo(ruta){return String(ruta).split('/').pop()}

function tarjetaVideo(p){
  var v=el('video',{controls:true,preload:'none',playsinline:true,poster:p.portada,src:p.video,'aria-label':p.titulo});
  v.style.aspectRatio=razon(p.formato)||'9 / 16';
  return el('figure',{'data-id':p.id,'data-tipo':'video'},[v,
    el('figcaption',{},[el('strong',{text:p.titulo}),
      el('a',{class:'btn',href:p.video,download:true,'aria-label':'Descargar el video «'+p.titulo+'»',text:'Descargar'})])]);
}

function tarjetaCarrusel(p){
  var n=p.placas.length,i=0,ar=razon(p.formato)||'4 / 5';
  var pista=el('div',{class:'pista',tabindex:'0',role:'group','aria-roledescription':'carrusel',
    'aria-label':p.titulo+'. '+n+' placas. Usá las flechas del teclado para pasar de una a otra.'});
  p.placas.forEach(function(src,k){
    var im=el('img',{src:src,loading:'lazy',decoding:'async',alt:p.titulo+', placa '+(k+1)+' de '+n});
    im.style.aspectRatio=ar;pista.appendChild(im);
  });
  var ant=el('button',{type:'button',class:'fl a','aria-label':'Placa anterior',text:'‹'});
  var sig=el('button',{type:'button',class:'fl p','aria-label':'Placa siguiente',text:'›'});
  var puntos=el('div',{class:'puntos','aria-hidden':'true'});
  for(var k=0;k<n;k++)puntos.appendChild(el('i'));
  var cuenta=el('span',{class:'cuenta','aria-live':'polite'});
  function pintar(){
    for(var k=0;k<n;k++)puntos.children[k].className=k===i?'on':'';
    cuenta.innerHTML='';
    cuenta.appendChild(el('span',{class:'vo',text:'Placa '}));
    cuenta.appendChild(document.createTextNode((i+1)+' / '+n));
    ant.disabled=i===0;sig.disabled=i===n-1;
  }
  function ir(k){
    k=Math.max(0,Math.min(n-1,k));
    pista.scrollTo({left:k*pista.clientWidth,behavior:quieto?'auto':'smooth'});
  }
  var espera=0;
  pista.addEventListener('scroll',function(){
    if(espera)return;
    espera=requestAnimationFrame(function(){
      espera=0;
      var k=Math.round(pista.scrollLeft/(pista.clientWidth||1));
      if(k!==i){i=Math.max(0,Math.min(n-1,k));pintar()}
    });
  });
  ant.addEventListener('click',function(){ir(i-1)});
  sig.addEventListener('click',function(){ir(i+1)});
  pista.addEventListener('keydown',function(e){
    var k=e.key==='ArrowRight'?i+1:e.key==='ArrowLeft'?i-1:e.key==='Home'?0:e.key==='End'?n-1:null;
    if(k===null)return;
    e.preventDefault();ir(k);
  });
  pintar();
  var botones=el('span',{class:'d'},[
    p.pdf?el('a',{class:'btn',href:p.pdf,download:true,'aria-label':'Descargar en PDF el carrusel «'+p.titulo+'»',text:'Descargar PDF'}):null]);
  var zip=el('button',{type:'button',class:'btn s','aria-label':'Descargar las placas del carrusel «'+p.titulo+'»',text:'Descargar placas'});
  zip.addEventListener('click',function(){bajarPlacas(p,zip)});
  botones.appendChild(zip);
  return el('figure',{'data-id':p.id,'data-tipo':'carrusel'},[
    el('div',{class:'visor'},[pista,ant,sig]),
    el('div',{class:'pie'},[puntos,cuenta]),
    el('figcaption',{},[el('strong',{text:p.titulo}),botones])]);
}

/* Descarga de placas: un solo archivo .zip armado en el navegador (sin compresión). */
var TABLA=(function(){var t=[],c,n,k;for(n=0;n<256;n++){c=n;for(k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc(b){var c=-1,i;for(i=0;i<b.length;i++)c=TABLA[(c^b[i])&255]^(c>>>8);return (c^-1)>>>0}
function armarZip(arch){
  var partes=[],central=[],pos=0,enc=new TextEncoder();
  arch.forEach(function(a){
    var nom=enc.encode(a.nombre),c=crc(a.datos),t=a.datos.length;
    var h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);
    h.setUint16(10,0,true);h.setUint16(12,0x21,true);h.setUint32(14,c,true);h.setUint32(18,t,true);h.setUint32(22,t,true);
    h.setUint16(26,nom.length,true);h.setUint16(28,0,true);
    var d=new DataView(new ArrayBuffer(46));
    d.setUint32(0,0x02014b50,true);d.setUint16(4,20,true);d.setUint16(6,20,true);d.setUint16(8,0x0800,true);d.setUint16(10,0,true);
    d.setUint16(12,0,true);d.setUint16(14,0x21,true);d.setUint32(16,c,true);d.setUint32(20,t,true);d.setUint32(24,t,true);
    d.setUint16(28,nom.length,true);d.setUint32(42,pos,true);
    partes.push(h.buffer,nom,a.datos);central.push(d.buffer,nom);
    pos+=30+nom.length+t;
  });
  var tam=0;central.forEach(function(x){tam+=x.byteLength});
  var f=new DataView(new ArrayBuffer(22));
  f.setUint32(0,0x06054b50,true);f.setUint16(8,arch.length,true);f.setUint16(10,arch.length,true);f.setUint32(12,tam,true);f.setUint32(16,pos,true);
  return new Blob(partes.concat(central,[f.buffer]),{type:'application/zip'});
}
function bajarPlacas(p,boton){
  var texto=boton.textContent;
  boton.disabled=true;boton.textContent='Preparando…';
  Promise.all(p.placas.map(function(src){
    return fetch(src).then(function(r){if(!r.ok)throw new Error(src);return r.arrayBuffer()})
      .then(function(b){return {nombre:archivo(src),datos:new Uint8Array(b)}});
  })).then(function(arch){
    var url=URL.createObjectURL(armarZip(arch));
    var a=el('a',{href:url,download:(p.id||'carrusel')+'-placas.zip'});
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(url)},60000);
    boton.textContent=texto;
  }).catch(function(){
    boton.textContent='No se pudo descargar';
    setTimeout(function(){boton.textContent=texto},3000);
  }).then(function(){boton.disabled=false});
}

function pintarTodo(){
  var visibles=datos.piezas.filter(function(p){return filtro==='todo'||p.tipo===filtro});
  var meses=[],porMes={};
  visibles.forEach(function(p){if(!porMes[p.mes]){porMes[p.mes]=[];meses.push(p.mes)}porMes[p.mes].push(p)});
  meses.sort().reverse();
  lista.innerHTML='';nav.innerHTML='';
  if(!visibles.length){lista.appendChild(el('p',{class:'aviso',text:'Todavía no hay piezas de este tipo.'}));nav.hidden=true;return}
  nav.hidden=meses.length<2;
  if(meses.length>1)nav.appendChild(el('span',{text:'Ir a:'}));
  meses.forEach(function(m){
    var ps=porMes[m],sec=el('section',{class:'mes',id:'mes-'+m,'data-mes':m});
    sec.appendChild(el('h2',{},[document.createTextNode(nombreMes(m)+' '),el('small',{text:cuantas(ps.length,'pieza','piezas')})]));
    if(meses.length>1)nav.appendChild(el('a',{href:'#mes-'+m,text:nombreMes(m)}));
    var series=[],porSerie={};
    ps.forEach(function(p){var s=p.serie||'Otras piezas';if(!porSerie[s]){porSerie[s]=[];series.push(s)}porSerie[s].push(p)});
    series.forEach(function(s){
      var items=porSerie[s],bloque=el('div',{class:'serie','data-serie':s});
      bloque.appendChild(el('h3',{text:s}));
      if(datos.notas[s])bloque.appendChild(el('p',{class:'nota',text:datos.notas[s]}));
      var vs=items.filter(function(p){return p.tipo==='video'}),cs=items.filter(function(p){return p.tipo==='carrusel'});
      if(vs.length)bloque.appendChild(el('div',{class:'g'},vs.map(tarjetaVideo)));
      if(cs.length)bloque.appendChild(el('div',{class:'g c'},cs.map(tarjetaCarrusel)));
      sec.appendChild(bloque);
    });
    lista.appendChild(sec);
  });
}

Array.prototype.forEach.call(document.querySelectorAll('.barra button'),function(b){
  b.addEventListener('click',function(){
    filtro=b.getAttribute('data-f');
    Array.prototype.forEach.call(document.querySelectorAll('.barra button'),function(o){o.setAttribute('aria-pressed',o===b?'true':'false')});
    pintarTodo();
  });
});

fetch('biblioteca.json',{cache:'no-cache'}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()}).then(function(j){
  var piezas=Array.isArray(j)?j:(j.piezas||[]);
  datos.piezas=piezas.filter(function(p){
    return p&&p.titulo&&/^\d{4}-\d{2}$/.test(p.mes||'')&&((p.tipo==='video'&&p.video)||(p.tipo==='carrusel'&&p.placas&&p.placas.length));
  });
  datos.notas=(!Array.isArray(j)&&j.notas_de_serie)||{};
  pintarTodo();
}).catch(function(){
  lista.innerHTML='';
  lista.appendChild(el('p',{class:'aviso',text:'No pudimos cargar la biblioteca. Probá recargar la página.'}));
});
})();
</script>
</body>
</html>
