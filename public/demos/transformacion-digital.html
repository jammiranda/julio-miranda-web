<style>
/* ===== Kit de demo: barra superior, marca y recorrido guiado ===== */
:root{--k-accent:#C8231F;--k-accent-2:#9E1A17;--k-accent-soft:#FBEAEA;--k-ink:#0B0D12;--k-gray:#4A515C;--kbar-h:36px}
html[data-marca="blanca"]{--k-accent:#1D4E89;--k-accent-2:#153A66;--k-accent-soft:#E7EEF7}
body{padding-top:var(--kbar-h)}
.kbar{position:fixed;inset:0 0 auto 0;z-index:9000;background:#0B0D12;color:#E9EBEF;font:500 13px/1.3 Inter,system-ui,sans-serif;border-bottom:1px solid #22262E}
.kbar-in{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;padding:6px 16px;min-height:36px;box-sizing:border-box;max-width:1600px;margin:0 auto}
.kbar-msg{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.kbar-dot{width:7px;height:7px;border-radius:50%;background:#F5B83D;flex:none}

.kbar-tools{margin-left:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.kbar .klink{color:#E9EBEF;text-decoration:underline;text-underline-offset:3px}
.kbar .kbtn{background:transparent;border:1px solid #3A404B;border-radius:6px;padding:3px 9px;cursor:pointer;white-space:nowrap}

.kseg{display:inline-flex;align-items:center;gap:6px;color:#AEB4BF}
.kseg span{white-space:nowrap}
.kseg-g{display:inline-flex;border:1px solid #3A404B;border-radius:6px;overflow:hidden}
.kseg-g button{background:transparent;border:0;padding:3px 8px;cursor:pointer;color:#C9CED6}
.kseg-g button[aria-pressed="true"]{background:#E9EBEF;color:#0B0D12;font-weight:600}
.kbar :focus-visible,.ktour-card :focus-visible{outline:2px solid #F5B83D;outline-offset:2px}
.kbar-in>*{flex:none}.kbr{display:none}.kbar-msg{order:1}.kcta{order:2}#kTourBtn{order:3;margin-left:auto}.kseg{order:4}.klink{order:5}
.kbtn .km{display:none}
@media (max-width:640px){.kbar{font-size:12px}.kbar-in{padding:5px 12px;gap:5px 8px}.klink{order:2}#kTourBtn{order:3}.kbr{display:block;order:4;flex-basis:100%;height:0}.kcta{order:5}.kseg{order:6;margin-left:auto}
 .kseg>span:first-child{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}.kseg-g button{padding:3px 7px;font-size:11.5px}.kbtn .kd{display:none}.kbtn .km{display:inline}.kbar .kcta{padding:3px 9px}}
main:focus,[tabindex="-1"]:focus{outline:none}
.klogo{display:inline-flex;align-items:center;gap:0;font:800 1em/1 "Inter Tight",Inter,system-ui,sans-serif;letter-spacing:-.01em;white-space:nowrap}
.klogo .r{color:#C8231F}
.klogo .km{margin-right:.45em;width:1.5em;height:1.5em;border-radius:.4em;background:var(--k-accent);display:inline-grid;place-items:center;color:#fff;font-size:.62em;letter-spacing:0}
html[data-marca="blanca"] .k-dvb-only{display:none!important}
html:not([data-marca="blanca"]) .k-white-only{display:none!important}
/* recorrido */
.ktour-shield{position:fixed;inset:0;z-index:9500;background:transparent;cursor:default}
.ktour-ring{position:fixed;z-index:9510;pointer-events:none;border-radius:10px;box-shadow:0 0 0 3px #F5B83D,0 0 0 9999px rgba(11,13,18,.28);transition:all .45s cubic-bezier(.3,.7,.2,1);opacity:0}
.ktour-cursor{position:fixed;z-index:9600;left:50%;top:50%;width:28px;height:28px;pointer-events:none;transition:left .75s cubic-bezier(.4,.1,.2,1),top .75s cubic-bezier(.4,.1,.2,1);filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.ktour-cursor.click::after{content:"";position:absolute;left:-14px;top:-14px;width:28px;height:28px;border-radius:50%;border:3px solid #F5B83D;animation:kclick .5s ease-out}
@keyframes kclick{from{transform:scale(.3);opacity:1}to{transform:scale(1.6);opacity:0}}
.ktour-cap{position:fixed;z-index:9700;left:50%;bottom:22px;transform:translateX(-50%);width:min(920px,calc(100% - 24px));box-sizing:border-box;background:rgba(11,13,18,.94);color:#fff;border-radius:14px;padding:16px 22px 16px 22px;font:600 clamp(17px,2.1vw,24px)/1.35 "Inter Tight",Inter,system-ui,sans-serif;box-shadow:0 12px 40px rgba(0,0,0,.35);display:flex;gap:14px;align-items:flex-start}
.ktour-cap .n{flex:none;font:700 13px/1 Inter,system-ui,sans-serif;background:var(--k-accent);border-radius:999px;padding:6px 9px;margin-top:3px}
.ktour-cap .t{flex:1}
.ktour-cap button{flex:none;background:transparent;border:1px solid #4A515C;color:#C9CED6;border-radius:8px;font:500 12px Inter,sans-serif;padding:5px 8px;cursor:pointer}
.ktour-end{position:fixed;inset:0;z-index:9800;display:grid;place-items:center;background:rgba(11,13,18,.72);padding:16px}
.ktour-card{background:#fff;color:#0B0D12;border-radius:20px;padding:36px 32px;max-width:520px;width:100%;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.4);font-family:Inter,system-ui,sans-serif}
.ktour-card h2{font:800 clamp(26px,4vw,36px)/1.15 "Inter Tight",Inter,sans-serif;margin:0 0 10px;letter-spacing:-.02em}
.ktour-card .big{font:800 clamp(28px,5vw,42px)/1 "Inter Tight",Inter,sans-serif;color:var(--k-accent);margin:14px 0 22px;letter-spacing:-.02em}
.ktour-card p{color:#4A515C;margin:0 0 6px;font-size:16px}
.ktour-card .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.ktour-card p.knote{font-size:14px;margin:-8px auto 18px;padding:8px 12px;background:#F4F5F7;border-radius:10px;display:inline-block}
.ktour-card a,.ktour-card button{font:600 15px Inter,sans-serif;border-radius:10px;padding:11px 18px;cursor:pointer;text-decoration:none}
.ktour-card a{background:var(--k-accent);color:#fff;border:0}
.ktour-card button{background:#fff;border:1px solid #C3C8D1;color:#0B0D12}
@media print{.kbar,.ktour-cap,.ktour-cursor,.ktour-ring,.ktour-shield,.ktour-end{display:none!important}body{padding-top:0!important}}
html.ktour-on .toast{bottom:auto!important;top:calc(var(--kbar-h) + 72px)!important}

.field{display:flex;flex-direction:column;gap:5px;margin:14px 0}

.qwrap{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:22px;align-items:start}

.pg{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.pg .bar{flex:1;height:8px;border-radius:5px;background:#E4E1DA;overflow:hidden}

.pg span{font-weight:600;font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.qcard{padding:28px}

.dchip{display:inline-flex;align-items:center;gap:8px;font:700 12.5px Inter,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--k-accent);background:var(--k-accent-soft);padding:5px 10px;border-radius:999px}
.qcard h2{font-size:clamp(22px,2.6vw,30px);line-height:1.2;margin:14px 0 18px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:14px;align-items:center;text-align:left;padding:14px 16px;border:1.5px solid var(--line);border-radius:14px;background:var(--sf);cursor:pointer;transition:border-color .15s,background .15s;font-size:15.5px}
.opt:hover{border-color:#8F8A80}
.opt[aria-checked="true"]{border-color:var(--k-accent);background:var(--k-accent-soft)}
.opt .n{flex:none;width:34px;height:34px;border-radius:10px;border:1.5px solid #BDB8AE;display:grid;place-items:center;font-weight:700;font-variant-numeric:tabular-nums}
.opt[aria-checked="true"] .n{background:var(--k-accent);border-color:var(--k-accent);color:#fff}
.opt .lv{display:block;font-size:12.5px;color:var(--mut);font-weight:600}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.side{padding:18px;position:sticky;top:calc(var(--kbar-h) + 16px)}
.side ol{list-style:none;margin:10px 0 0;padding:0}

.side li:first-child{border-top:0}
.side .dot{width:22px;height:22px;border-radius:50%;border:2px solid #BDB8AE;display:grid;place-items:center;flex:none;font-size:11px;font-weight:700}
.side li.cur{font-weight:700}.side li.cur .dot{border-color:var(--k-accent);color:var(--k-accent)}
.side li.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.kbd{font-size:12.5px;color:var(--mut);margin-top:12px}
/* resultado */
.rh{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-end;margin-bottom:18px}

.rgrid{display:grid;grid-template-columns:1.05fr 1fr;gap:18px;margin-bottom:18px}
@media (max-width:900px){.rgrid{grid-template-columns:1fr}}
.score{padding:24px;display:flex;flex-direction:column;gap:14px}
.lvl{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.lvl .big{font:800 64px/1 "Inter Tight",sans-serif;letter-spacing:-.03em}
.lvl .big small{font-size:22px;color:var(--mut);font-weight:700}
.badge{display:inline-block;font:800 20px "Inter Tight",sans-serif;padding:8px 16px;border-radius:12px;color:#fff;background:var(--k-accent)}
.ladder{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:4px}
.ladder div{border-radius:8px;padding:8px;font-size:13px;font-weight:600;background:#EEEBE5;color:var(--mut);text-align:center}
.ladder div.on{background:var(--ink);color:#fff}
.radar{padding:18px;display:flex;flex-direction:column;align-items:center}
.radar svg{width:100%;max-width:520px;height:auto}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--mut);justify-content:center}
.legend i{display:inline-block;width:14px;height:4px;border-radius:2px;vertical-align:middle;margin-right:6px}
.dbars{display:grid;gap:10px}
.dbar{display:grid;grid-template-columns:150px 1fr 44px;gap:10px;align-items:center;font-size:14.5px}
.dbar .t{height:10px;background:#EEEBE5;border-radius:6px;overflow:hidden}.dbar .t i{display:block;height:100%;border-radius:6px;background:var(--ink)}
.dbar b{text-align:right;font-variant-numeric:tabular-nums}
.recs h2{font-size:26px;margin-bottom:4px}
.rec{display:grid;grid-template-columns:56px 1fr;gap:16px;padding:20px;margin-top:12px}
.rec .num{width:56px;height:56px;border-radius:16px;background:var(--ink);color:#fff;display:grid;place-items:center;font:800 24px "Inter Tight",sans-serif}
.rec:first-of-type .num{background:var(--k-accent)}
.rec h3{font-size:20px;margin:2px 0 6px}
.rec p{margin:0 0 8px;color:var(--mut)}
.rec .first{font-size:14.5px;background:#F5F3EF;border-radius:10px;padding:10px 12px}
.rec .tag{font:700 12px Inter;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.ctas{padding:24px;margin-top:18px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:var(--ink);color:#fff;border:0}
.ctas h2{font-size:24px}
.ctas p{margin:4px 0 0;color:#C9CED6}
.ctas .row{display:flex;gap:10px;flex-wrap:wrap;margin-left:auto}
.ctas .btn-s{background:transparent;color:#fff;border-color:#6B7280}

.print-only{display:none}

.leadf{padding:26px;margin-bottom:18px}

<script>
window.DEMO={product:"Autodiagnóstico de madurez digital"};
/* ===== Kit de demo: barra superior, marca y recorrido guiado ===== */
const KIT=(()=>{
  const Q=new URLSearchParams(location.search);

    :`<span class="klogo" aria-label="DEVISEBIT"><span>DEVISE</span><span class="r">BIT</span></span>`;
  const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  function url(over){const q=new URLSearchParams(location.search);for(const k in over){if(over[k]==null)q.delete(k);else q.set(k,over[k])}const s=q.toString();return location.pathname+(s?"?"+s:"")+location.hash}
  function bar(){
    const b=document.createElement("div");b.className="kbar";b.setAttribute("role","region");b.setAttribute("aria-label","Aviso de demo");
    const sel=showSel?`<span class="kseg"><span id="kselLbl">Marca:</span><span class="kseg-g" role="group" aria-labelledby="kselLbl"><button type="button" data-kbrand="devisebit" aria-pressed="${!white}">DEVISEBIT</button><button type="button" data-kbrand="blanca" aria-pressed="${white}">Tu marca</button></span></span>`:"";
    b.innerHTML=`<div class="kbar-in"><div class="kbar-msg"><span class="kbar-dot" aria-hidden="true"></span><span>${basic?"Demo con funciones básicas y datos de ejemplo":"Demo con datos de ejemplo"}${white?"":" ·"}</span></div>${white?"":`<a class="kcta" href="${contact}">Quiero esto para mi organización</a>`}<button type="button" class="kbtn" id="kTourBtn">▶ <span class="kd">Ver recorrido guiado</span><span class="km">Recorrido</span></button><span class="kbr" aria-hidden="true"></span>${sel}${white?"":`<a class="klink" href="${SITE}">Inicio</a>`}</div>`;
    document.body.prepend(b);
    b.querySelectorAll("[data-kbrand]").forEach(x=>x.onclick=()=>{const v=x.dataset.kbrand;location.href=url({marca:v==="blanca"?"blanca":null,selector:v==="blanca"?"1":Q.get("selector")})});
    b.querySelector("#kTourBtn").onclick=()=>{location.href=url({tour:"1"})};
    const fit=()=>document.documentElement.style.setProperty("--kbar-h",b.offsetHeight+"px");
    fit();addEventListener("resize",fit);if(window.ResizeObserver)new ResizeObserver(fit).observe(b);
    if(Q.get("tour")==="1")b.querySelector("#kTourBtn").hidden=true;
  }
  function applyBrand(root=document){
    root.querySelectorAll("[data-k-logo]").forEach(e=>e.innerHTML=logo());
    root.querySelectorAll("[data-k-name]").forEach(e=>e.textContent=brandName);
  }
  /* ---------- recorrido guiado ---------- */
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  let cur,ring,cap,shield,stopped=false,total=0,idx=0,ringEl=null,raf=0;
  const cursorSVG=`<svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path d="M3 2l7.5 19 2.6-7.9L21 10.5z" fill="#fff" stroke="#0B0D12" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
  function el(sel){return typeof sel==="string"?document.querySelector(sel):sel}
  function track(){if(ring&&ringEl&&!ringEl.isConnected)ring.style.opacity=0;else if(ringEl&&ring){const r=ringEl.getBoundingClientRect();Object.assign(ring.style,{left:r.left-6+"px",top:r.top-6+"px",width:r.width+12+"px",height:r.height+12+"px",opacity:r.width?1:0})}raf=requestAnimationFrame(track)}
  async function show(sel,opt={}){
    const e=el(sel);if(!e)return null;
    const r0=e.getBoundingClientRect(),capH=cap?cap.offsetHeight+40:120;
    if(r0.top<parseInt(getComputedStyle(document.documentElement).getPropertyValue("--kbar-h"))+10||r0.bottom>innerHeight-capH){e.scrollIntoView({block:opt.block||"center",behavior:"smooth"});await sleep(650)}
    {const r1=e.getBoundingClientRect();if(r1.left<0||r1.right>innerWidth){e.scrollIntoView({block:"nearest",inline:"center",behavior:"smooth"});await sleep(500)}}
    ringEl=opt.ring===false?null:e;if(!ringEl&&ring)ring.style.opacity=0;
    const r=e.getBoundingClientRect();cur.style.transitionDuration=(opt.wait?opt.wait*.85/1000:.75)+"s";
    cur.style.left=Math.min(innerWidth-30,r.left+Math.min(r.width/2,r.width-8))+"px";cur.style.top=r.top+Math.min(r.height/2,22)+"px";
    await sleep(opt.wait||800);return e;
  }
  async function click(sel,opt){const e=await show(sel,opt);if(!e)return;cur.classList.remove("click");void cur.offsetWidth;cur.classList.add("click");await sleep(180);e.focus&&e.focus({preventScroll:true});e.click();await sleep(350);return e}
  async function type(sel,text,opt={}){
    const e=await show(sel,opt);if(!e)return;e.focus({preventScroll:true});
    const proto=e.tagName==="TEXTAREA"?HTMLTextAreaElement.prototype:HTMLInputElement.prototype;const set=Object.getOwnPropertyDescriptor(proto,"value").set;
    set.call(e,"");e.dispatchEvent(new Event("input",{bubbles:true}));
    for(const ch of text){set.call(e,e.value+ch);e.dispatchEvent(new Event("input",{bubbles:true}));await sleep(opt.speed||55)}
    e.dispatchEvent(new Event("change",{bubbles:true}));await sleep(250);return e;
  }
  async function pick(sel,value){const e=await show(sel);if(!e)return;e.value=value;e.dispatchEvent(new Event("input",{bubbles:true}));e.dispatchEvent(new Event("change",{bubbles:true}));await sleep(300);return e}
  function say(t){idx++;cap.querySelector(".n").textContent=idx+" / "+total;cap.querySelector(".t").textContent=t}

    document.body.appendChild(o);o.querySelector("#kEndBack").onclick=()=>{o.remove();history.replaceState(null,"",url({tour:null}));const t=document.getElementById("kTourBtn");if(t)t.hidden=false};
    o.querySelector("#kEndBack").focus({preventScroll:true});
    window.__tourDone=true;
  }
  async function run(steps){
    window.__tourDone=false;total=steps.length;idx=0;
    shield=document.createElement("div");shield.className="ktour-shield";shield.title="Recorrido en curso";
    ring=document.createElement("div");ring.className="ktour-ring";

    cap=document.createElement("div");cap.className="ktour-cap";cap.setAttribute("role","status");cap.setAttribute("aria-live","polite");

    document.body.append(shield,ring,cur,cap);document.documentElement.classList.add("ktour-on");track();

    addEventListener("keydown",e=>{if(e.key==="Escape")stopped=true});
    const T={show,click,type,pick,sleep,el};
    for(const s of steps){
      if(stopped)break;
      say(s.say);const t0=Date.now();
      try{await s.do(T)}catch(e){console.warn("tour",e)}
      const left=(s.hold||3000)-(Date.now()-t0);if(left>0)await sleep(left);
    }
    end();
  }
  function init(steps){
    bar();applyBrand();

  }
  return {white,brandName,contact,SITE,logo,applyBrand,init,run,esc,accent};
})();

function radar(sc){
  const cx=230,cy=210,R=150,n=6,ang=i=>-Math.PI/2+i*2*Math.PI/n,pt=(i,v)=>[cx+Math.cos(ang(i))*R*v/4,cy+Math.sin(ang(i))*R*v/4];
  const poly=vals=>vals.map((v,i)=>pt(i,v).map(x=>x.toFixed(1)).join(",")).join(" ");
  const mine=DIMS.map(([k])=>sc[k]),bench=DIMS.map(([k])=>BENCH[k]);
  let g="";for(let l=1;l<=4;l++)g+=`<polygon points="${poly(Array(6).fill(l))}" fill="${l===4?"#FAF9F6":"none"}" stroke="#DAD6CE" stroke-width="1"/>`;
  for(let i=0;i<n;i++){const [x,y]=pt(i,4);g+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#DAD6CE"/>`}
  for(let l=1;l<=4;l++){const [x,y]=pt(0,l);g+=`<text x="${x+5}" y="${y+4}" font-size="11" fill="#6B7280" font-family="Inter">${l}</text>`}
  const m=innerWidth<640,fL=m?25:13,fV=m?23:12.5,o1=i=>i===0?(m?-16:-2):i===3?(m?20:10):(m?2:4),o2=i=>o1(i)+(m?26:16);
  const lab=DIMS.map(([k,nm],i)=>{const [x,y]=pt(i,4.75);const anchor=Math.abs(x-cx)<5?"middle":x>cx?"start":"end";return `<text x="${x}" y="${y+o1(i)}" text-anchor="${anchor}" font-size="${fL}" font-weight="600" fill="#0B0D12" font-family="Inter">${nm}</text><text x="${x}" y="${y+o2(i)}" text-anchor="${anchor}" font-size="${fV}" font-weight="700" fill="${KIT.accent}" font-family="Inter">${sc[k].toFixed(1)}</text>`}).join("");
  const dots=mine.map((v,i)=>{const [x,y]=pt(i,v);return `<circle cx="${x}" cy="${y}" r="4.5" fill="${KIT.accent}" stroke="#fff" stroke-width="2"/>`}).join("");
  return `<svg viewBox="${m?"-160 -20 780 480":"-90 0 640 430"}" role="img" aria-labelledby="rdT rdD"><title id="rdT">Puntaje por dimensión</title><desc id="rdD">${DIMS.map(([k,nm])=>`${nm}: ${sc[k].toFixed(1)} de 4`).join("; ")}</desc>${g}
  <polygon points="${poly(bench)}" fill="none" stroke="#6B7280" stroke-width="2" stroke-dasharray="5 5"/>
  <g class="rpoly" style="transform-origin:${cx}px ${cy}px"><polygon points="${poly(mine)}" fill="${KIT.accent}" fill-opacity=".18" stroke="${KIT.accent}" stroke-width="2.5" stroke-linejoin="round"/>${dots}</g>${lab}</svg>`;
}

  const sc=dimScore(),avg=S.a.reduce((a,b)=>a+b,0)/12,lv=level(avg),li=LEVELS.indexOf(lv),pct=to100(avg);
  const low=Q.map((q,i)=>({i,v:S.a[i],p:PRIO[q.d]})).sort((a,b)=>a.v-b.v||a.p-b.p||a.i-b.i).slice(0,3);
  return {sc,avg,lv,li,pct,low};
}

const DISPOSABLE=["mailinator","guerrillamail","guerrillamailblock","grr","10minutemail","10minutemail","tempmail","temp-mail","tempmailo","yopmail","trashmail","sharklasers","getnada","nada","dispostable","maildrop","mailnesia","throwawaymail","fakeinbox"];
const DISPOSABLE_FULL=["grr.la","guerrillamail.info","pokemail.net","spam4.me","10minutemail.net","temp-mail.org","tempmail.dev","yopmail.fr","yopmail.net","trashmail.de","trashmail.net","getnada.com","maildrop.cc","dispostable.com","mailinator.com","sharklasers.com"];
const KNOWN=["gmail.com","hotmail.com","hotmail.com.ar","outlook.com","outlook.com.ar","live.com","live.com.ar","yahoo.com","yahoo.com.ar","icloud.com"];
const LEGIT=KNOWN.concat(["mail.com","aol.com","msn.com","me.com","proton.me","protonmail.com","fibertel.com.ar","speedy.com.ar","arnet.com.ar","ciudad.com.ar","gmx.com","zoho.com"]);
const TYPO={"gmal.com":"gmail.com","gmial.com":"gmail.com","gmai.com":"gmail.com","gamil.com":"gmail.com","gnail.com":"gmail.com","gmaill.com":"gmail.com","gmail.com.ar":"gmail.com","gmail.co":"gmail.com","gmail.con":"gmail.com","gmail.cm":"gmail.com","gmail.om":"gmail.com","hotmial.com":"hotmail.com","hotmal.com":"hotmail.com","hotmai.com":"hotmail.com","hotmil.com":"hotmail.com","hotamil.com":"hotmail.com","hotmail.con":"hotmail.com","hotmail.co":"hotmail.com","hotmail.com.ra":"hotmail.com.ar","outlok.com":"outlook.com","outloo.com":"outlook.com","outlook.con":"outlook.com","yaho.com":"yahoo.com","yahoo.con":"yahoo.com","yahoo.com.ra":"yahoo.com.ar","iclod.com":"icloud.com","icloud.con":"icloud.com","live.con":"live.com"};
function lev(a,b){const m=a.length,n=b.length;let p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function emailInfo(raw){
  const e=String(raw||"").trim();
  if(!e)return{err:"Escribí tu email para recibir el informe."};
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e)||/\.\.|@\.|\.@/.test(e)||e.length>254)return{err:"Revisá el email: tiene que ser del tipo nombre@dominio.com."};
  const [user,dom0]=[e.slice(0,e.lastIndexOf("@")),e.slice(e.lastIndexOf("@")+1)];const dom=dom0.toLowerCase();
  if(!/^[a-z0-9.-]+\.[a-z]{2,}$/.test(dom))return{err:"Revisá el dominio del email (lo que va después de la @)."};
  const labels=dom.split(".");
  if(DISPOSABLE_FULL.includes(dom)||labels.slice(0,-1).some(l=>DISPOSABLE.includes(l)))return{err:"Usá un email permanente: a las casillas temporales no les llega el informe."};
  let fix=TYPO[dom]||null;
  if(!fix&&!LEGIT.includes(dom)){
    const t=dom.replace(/\.(con|cmo|comm|vom|xom|cpm|ocm)$/,".com").replace(/\.com\.(ra|rr)$/,".com.ar");
    if(t!==dom)fix=t;
    else{let best=null,bd=9;for(const k of KNOWN){const d=lev(dom,k);if(d<bd){bd=d;best=k}}if(best&&bd>0&&bd<=2&&dom.length>5)fix=best}
  }
  return{email:e,sug:fix?user+"@"+fix:null};
}

V.res=()=>{

    :`<div class="notice warn no-print" id="notice" role="status" tabindex="-1"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8v5M12 16.5v.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="2"/></svg><span>No pudimos enviarte el email ahora; podés imprimir el resultado.</span></div>`):"";
  return notice+head+`<div class="rgrid"><section class="card score" aria-labelledby="lvT">${lvlBlock}
  <div class="dbars" style="margin-top:6px">${DIMS.map(([k,n])=>`<div class="dbar"><span>${n}</span><span class="t"><i style="width:${sc[k]/4*100}%"></i></span><b>${sc[k].toFixed(1)}</b></div>`).join("")}</div></section>
  <section class="card radar" aria-label="Gráfico radar">${radar(sc)}<div class="legend"><span><i style="background:${KIT.accent}"></i>${esc(S.org.trim()||"Tu organización")}</span><span><i style="background:repeating-linear-gradient(90deg,#6B7280 0 5px,transparent 5px 8px)"></i>Promedio de organizaciones similares (referencia)</span></div></section></div>
  <section class="recs" aria-labelledby="rcT"><h2 id="rcT">Tus 3 prioridades</h2><p class="small" style="margin:0">Ordenadas según tus respuestas más bajas y su impacto en el día a día.</p>
  ${low.map((x,k)=>{const q=Q[x.i];return `<article class="card rec"><span class="num">${k+1}</span><div><span class="tag">${esc(DIMS.find(d=>d[0]===q.d)[1])} · respondiste ${x.v} de 4</span><h3>${esc(q.r[0])}</h3><p>${esc(q.r[1])}</p><div class="first"><b>Primer paso:</b> ${esc(q.r[2])}</div></div></article>`}).join("")}</section>
  <section class="card ctas" aria-labelledby="ctT"><div><h2 id="ctT">¿Querés avanzar con un plan concreto?</h2><p>Te ayudamos a convertir estas prioridades en un plan de 90 días.</p></div>
  <div class="row">${KIT.white?"":`<a class="btn btn-s" href="${GUIDE}" id="guideB">📘 Descargá la guía</a>`}<a class="btn btn-w" href="${KIT.white?"#":KIT.contact}" id="meetB">📅 Agendá una reunión</a></div></section>`;
};
function render(focus){$("#view").innerHTML=V[S.step]();bind();if(focus)$("#view").focus({preventScroll:true})}
function answer(v){S.a[S.i]=v;render();clearTimeout(answer.t);answer.t=setTimeout(()=>{if(S.step==="q"&&S.a[S.i]===v)next()},380)}
let kb=false;addEventListener("keydown",()=>kb=true,true);addEventListener("pointerdown",()=>kb=false,true);
function popRadar(){const p=$(".rpoly");if(p&&p.animate)p.animate([{transform:"scale(0)",opacity:0},{transform:"scale(1)",opacity:1}],{duration:700,easing:"cubic-bezier(.3,.7,.2,1)"})}
function next(){if(S.a[S.i]==null)return;if(S.i<11){S.i++;render();const c=$('.opt[tabindex="0"]');if(kb&&c)c.focus({preventScroll:true})}else{S.step="res";S.unlocked=false;S.sent=null;render(true);window.scrollTo({top:0})}}
function setErr(id,inputId,msg){const e=$("#"+id);if(e)e.textContent=msg||"";const i=inputId&&$("#"+inputId);if(i){if(msg)i.setAttribute("aria-invalid","true");else i.removeAttribute("aria-invalid")}}
function showSug(s){const el=$("#sE");if(!el)return;if(!s){el.innerHTML="";return}if(el.dataset.s===s&&el.querySelector("#sugB"))return;el.dataset.s=s;el.innerHTML=`¿Quisiste decir <button type="button" id="sugB">${esc(s)}</button>?`;$("#sugB").onmousedown=e=>e.preventDefault();$("#sugB").onclick=()=>{const i=$("#fE");i.value=s;el.innerHTML="";setErr("eE","fE","");S.sugSkip="";i.focus()}}
function checkEmail(final){
  const i=$("#fE"),r=emailInfo(i.value);
  if(r.err){if(final||i.value.trim())setErr("eE","fE",r.err);showSug(null);return false}
  setErr("eE","fE","");showSug(r.sug);
  if(final&&r.sug&&S.sugSkip!==r.email){S.sugSkip=r.email;setErr("eE","fE","Revisá el email antes de enviar. Si está bien escrito, tocá de nuevo el botón.");return false}
  return true;
}
function validate(){

  const n=$("#fN").value.trim();setErr("eN","fN",n.length<2?"Escribí tu nombre.":"");mark(n.length>=2,$("#fN"));
  mark(checkEmail(true),$("#fE"));
  const w=$("#fW").value.trim(),dg=w.replace(/\D/g,"");const wOk=!w||(dg.length>=8&&dg.length<=15&&/^[\d\s()+.-]+$/.test(w));
  setErr("eW","fW",wOk?"":"Revisá el número: incluí la característica, por ejemplo 11 2345-6789.");mark(wOk,$("#fW"));
  const a=$("#fA").checked;setErr("eA","fA",a?"":"Para enviarte el informe necesitamos que aceptes la política de privacidad.");mark(a,$("#fA"));
  if(first)first.focus();

}

async function sendLead(e){
  e&&e.preventDefault();
  const btn=$("#sendB");if(!btn||btn.getAttribute("aria-busy")==="true")return;
  if(!validate())return;
  const body=payload();S.lead={nombre:body.nombre,email:body.email,organizacion:body.organizacion,telefono:body.telefono};
  btn.setAttribute("aria-busy","true");btn.innerHTML=`<span class="spin" aria-hidden="true"></span>Enviando…`;$("#lfS").disabled=true;$("#leadF").setAttribute("aria-busy","true");

  else{
    const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),15000);

      const j=await r.json().catch(()=>null);ok=!!(r.ok&&j&&j.ok===true);if(!ok&&j&&j.error)console.info("diagnostico:",j.error)}

}
function privacy(){const r=$("#modalRoot"),prev=document.activeElement;r.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="pT"><div class="card"><h2 id="pT" style="font-size:22px">Política de privacidad</h2><p>Usamos tus datos solo para enviarte el informe del autodiagnóstico y, si lo pedís, contactarte para ayudarte con un plan. No los compartimos con terceros y podés pedir que los borremos cuando quieras.</p><div style="display:flex;justify-content:flex-end"><button type="button" class="btn btn-p" id="pC">Entendido</button></div></div></div>`;
